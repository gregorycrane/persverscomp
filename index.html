        .resize-handle-h {
            width: 5px;
            cursor: col-resize;
            min-height: 0;
            height: 100%;
        }
        .resize-handle-v {
            height: 5px;
            cursor: row-resize;
            width: 100%;
        }
        .resize-handle::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .resize-handle-h::after {
            width: 1px; height: 30px;
            border-left: 1px dotted #999;
            border-right: 1px dotted #999;
            column-gap: 2px;
        }
        .resize-handle-v::after {
            height: 1px; width: 30px;
            border-top: 1px dotted #999;
            border-bottom: 1px dotted #999;
            row-gap: 2px;
        }
        body.resizing-cols, body.resizing-cols * { cursor: col-resize !important; }
        body.resizing-rows, body.resizing-rows * { cursor: row-resize !important; }

  <script id="manifesto-markdown-source" type="text/markdown">## What is being tested here?
This prototype serves as a targeted verification environment exploring two distinct user interface paradigms for comparative philology and reading. It bridges the structural architecture of classic digital humanities environments with modern cognitive reading models.

We are testing an optimized version of the **Traditional Perseus 4 Asymmetric View** alongside a brand new **Parallel Workspace View**. This parallel mode is explicitly engineered to eliminate textual dislocation by letting human operators line up multiple, multilingual sources completely side by side in parallel.

The core philosophy driving this implementation focuses on alignment layers over monolithic distributions. By binding varying editions, codices, and historical translations to a unified **Canonical Text Services (CTS) structural grid**, we eliminate structural discrepancies ahead of display compilation.

## The Optimization Hypothesis
Traditional reading platforms introduce severe contextual shifts when shifting between separate commentaries or translation apparatuses. This interface tests a foundational structural premise:

> "Aligning primary resources directly to an atomic CTS grid map allows human operators to parse multi-text parallel layers with significantly higher cognitive efficiency, lowering comparative text mapping friction to an absolute minimum."

**Core Structural Systems Verified inside this Build:**
* **Hierarchical Parsing Layers:** Synchronous processing across multi-book prose boundaries (e.g., Thucydides' *Histories*).
* **Milestone Structural Intersections:** Tracking non-prose anchoring indexes dynamically, such as Bekker formatting architectures mapped across Aristotle's *Poetics* layers.
* **Poetry Structural Intervals:** Real-time indexing maps matching arbitrary structural performance line-cards smoothly within Sophocles' *Oedipus Tyrannus*.</script>

    const WORKSPACE_DATA_REGISTRY = new Map();
    
    let activeWorkKey = "";
    let activeUrnContext = "";

    let columnEditions = { f: "", c1: "", c2: "", c3: "" };

    function renderInlineManifesto() {
        try {
            const markdownText = document.getElementById("manifesto-markdown-source").innerHTML;
            if (typeof marked !== 'undefined') {
                document.getElementById("manifesto-render-target").innerHTML = marked.parse(markdownText);
            } else {
                const fallbackHtml = markdownText
                    .replace(/^\s*##\s+(.*)$/gm, '<h2>$1</h2>')
                    .replace(/^\s*>\s+(.*)$/gm, '<blockquote>$1</blockquote>')
                    .replace(/^\s*\*\s+(.*)$/gm, '<li>$1</li>')
                    .split('\n\n')
                    .map(p => p.trim().startsWith('<h') || p.trim().startsWith('<b') || p.trim().startsWith('<l') ? p : `<p>${p}</p>`)
                    .join('');
                document.getElementById("manifesto-render-target").innerHTML = fallbackHtml;
            }
        } catch (err) {
            console.error("Local manifesto parsing error:", err);
        }
    }

    window.setWorkspaceLayoutMode = function(mode) {
        currentActiveMode = mode;
        const frame = document.getElementById("outer-wrapper");
        const btnParallel = document.getElementById("btn-mode-parallel");
        const btnClassic = document.getElementById("btn-mode-classic");
        
        if (mode === 'classic') {
            frame.className = "mode-classic" + (fourthColumnActive ? " four-columns" : "");
            btnClassic.classList.add("active-mode");
            btnParallel.classList.remove("active-mode");
        } else {
            frame.className = "mode-parallel" + (fourthColumnActive ? " four-columns" : "");
            btnParallel.classList.add("active-mode");
            btnClassic.classList.remove("active-mode");
        }
        
        updateClassicGridForColumns();
        if (WORKSPACE_DATA_REGISTRY.has(activeUrnContext)) {
            const payload = WORKSPACE_DATA_REGISTRY.get(activeUrnContext);
            renderNavigationControls(payload);
        }
    };

    function launchWorkspace(e) {
        if(e) e.preventDefault();
        document.getElementById("splash-view-root").style.display = "none";
        document.getElementById("app-view-root").style.display = "flex";
        initializeRoutingFromURL();
    }

    window.registerWorkspaceChunk = function(urn, dataPayload) {
        WORKSPACE_DATA_REGISTRY.set(urn, dataPayload);
        triggerRenderLifecycle(urn);
    };

    document.addEventListener("DOMContentLoaded", function() {
        renderInlineManifesto();
        const params = new URLSearchParams(window.location.search);
        if (params.has("w")) {
            document.getElementById("splash-view-root").style.display = "none";
            document.getElementById("app-view-root").style.display = "flex";
            initializeRoutingFromURL();
        }
    });

    function populateDropdownsForWork(tgId, wkId) {
        const currentWorkPrefix = `${tgId}_${wkId}_`;
        const validEditionIds = Object.keys(TEXT_REGISTRY).filter(vId => vId.startsWith(currentWorkPrefix));
        if (validEditionIds.length === 0) return;

        if (!columnEditions.f || !validEditionIds.includes(columnEditions.f)) columnEditions.f = validEditionIds[0];
        if (!columnEditions.c1 || !validEditionIds.includes(columnEditions.c1)) columnEditions.c1 = validEditionIds[1] || validEditionIds[0];
        if (!columnEditions.c2 || !validEditionIds.includes(columnEditions.c2)) columnEditions.c2 = validEditionIds[2] || validEditionIds[0];
        if (!columnEditions.c3 || !validEditionIds.includes(columnEditions.c3)) columnEditions.c3 = validEditionIds[3] || validEditionIds[0];

        ['f', 'c1', 'c2', 'c3'].forEach(prefix => {
            const selectEl = document.getElementById(`select_${prefix}`);
            if (!selectEl) return;
            selectEl.innerHTML = "";
            validEditionIds.forEach(vId => {
                const opt = document.createElement("option");
                opt.value = vId;
                opt.innerText = TEXT_REGISTRY[vId].label;
                if(columnEditions[prefix] === vId) opt.selected = true;
                selectEl.appendChild(opt);
            });
        });
    }

    function isFlatStructure(wKey) {
        return Array.isArray(GLOBAL_STRUCTURES[wKey]);
    }

    function isPoetryWork(wKey) {
        return wKey.startsWith("tlg0011.");
    }

    function initializeRoutingFromURL() {
        try {
            const params = new URLSearchParams(window.location.search);
            const rawParam = params.get("w") || "";
            let b = "", ch = "";
            activeSectionFilter = null;
            
            columnEditions.c1 = params.get("right") || "";
            columnEditions.c2 = params.get("right2") || "";
            columnEditions.c3 = params.get("right3") || "";
            if (params.get("cols") === "4") { setTimeout(() => toggleFourthColumn(), 0); }

            if (rawParam.includes(":")) {
                const querySegments = rawParam.split(":");
                let workPart = querySegments[0];
                const lastUnderscoreIdx = workPart.lastIndexOf('_');
                if (lastUnderscoreIdx !== -1 && TEXT_REGISTRY[workPart]) {
                    columnEditions.f = workPart;
                    const parts = workPart.split('_');
                    workPart = `${parts[0]}.${parts[1]}`;
                } else {
                    columnEditions.f = "";
                }
                activeWorkKey = workPart;
                const passageSegments = querySegments[1].split(".");
                
                if (isFlatStructure(activeWorkKey)) {
                    b = ""; ch = passageSegments[0] || "1";
                    if (passageSegments[1]) activeSectionFilter = passageSegments[1];
                } else {
                    b = passageSegments[0]; ch = passageSegments[1] || "1";
                    if (passageSegments[2]) activeSectionFilter = passageSegments[2];
                }
            } else {
                activeWorkKey = rawParam || Object.keys(GLOBAL_STRUCTURES)[0];
                if (!GLOBAL_STRUCTURES[activeWorkKey]) activeWorkKey = Object.keys(GLOBAL_STRUCTURES)[0];
                
                if (isFlatStructure(activeWorkKey)) {
                    b = ""; ch = GLOBAL_STRUCTURES[activeWorkKey][0] || "1";
                } else {
                    b = Object.keys(GLOBAL_STRUCTURES[activeWorkKey])[0];
                    ch = GLOBAL_STRUCTURES[activeWorkKey][b][0] || "1";
                }
                columnEditions.f = "";
            }

            const targetUrn = b ? `urn:cts:greekLit:${activeWorkKey}:${b}.${ch}` : `urn:cts:greekLit:${activeWorkKey}:${ch}`;
            resolveAndInjectUrn(targetUrn);
        } catch (err) {
            console.error("Initialization Failed:", err);
            document.getElementById("frame-context-label").innerText = "Runtime Error: " + err.message;
        }
    }

    function resolveAndInjectUrn(urn) {
        if (WORKSPACE_DATA_REGISTRY.has(urn)) {
            triggerRenderLifecycle(urn);
            return;
        }
        document.getElementById("frame-context-label").innerText = `Resolving storage path for ${urn}...`;
        
        const parts = urn.split(":");
        const workComponents = parts[3].split(".");
        const passageComponents = parts[4].split(".");
        const tgId = workComponents[0];
        const wkId = workComponents[1];

        populateDropdownsForWork(tgId, wkId);
        const script = document.createElement("script");
        const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

        if (passageComponents.length > 1 && !isFlatStructure(`${tgId}.${wkId}`)) {
            script.src = `${basePath}corpus/${tgId}/${wkId}/chunks/chunk_b${passageComponents[0]}_ch${passageComponents[1]}.js`;
        } else {
            script.src = `${basePath}corpus/${tgId}/${wkId}/chunks/chunk_ch${passageComponents[0]}.js`;
        }
        script.onerror = () => { document.getElementById("frame-context-label").innerText = `Path Resolution Failed for ${urn}`; };
        document.head.appendChild(script);
    }

    function triggerRenderLifecycle(urn) {
        activeUrnContext = urn;
        const payload = WORKSPACE_DATA_REGISTRY.get(urn);
        if (!payload) return;
        
        activeWorkKey = `${payload.textgroup}.${payload.work}`;
        populateDropdownsForWork(payload.textgroup, payload.work);

        updateURLState(payload.book, payload.chapter);
        renderNavigationControls(payload);
        renderActiveContentLayers(payload);
    }

    function updateURLState(book, chapter) {
        const params = new URLSearchParams();
        let passageValue = book ? `${book}.${chapter}` : `${chapter}`;
        if (activeSectionFilter) passageValue += `.${activeSectionFilter}`;
        
        params.set("w", `${activeWorkKey}.${columnEditions.f}:${passageValue}`);
        if(columnEditions.c1) params.set("right", columnEditions.c1);
        if(columnEditions.c2) params.set("right2", columnEditions.c2);
        if(columnEditions.c3) params.set("right3", columnEditions.c3);
        if(fourthColumnActive) params.set("cols", "4");
        
        const currentPathname = window.location.pathname;
        window.history.replaceState(null, "", currentPathname + "?" + params.toString());
    }

    function selectSectionDirectly(secId) {
        activeSectionFilter = secId;
        if (WORKSPACE_DATA_REGISTRY.has(activeUrnContext)) triggerRenderLifecycle(activeUrnContext);
    }

    function renderNavigationControls(payload) {
        document.getElementById("frame-context-label").innerText = `Active Frame Context: ${payload.urn}`;
        
        const isDramaOrPoetry = isPoetryWork(activeWorkKey);
        
        const rowWork = document.getElementById("row-work-selector");
        const rowBook = document.getElementById("row-book-container");
        const rowChapter = document.getElementById("row-chapter-selector");
        const rowSection = document.getElementById("row-section-selector");

        if (currentActiveMode === 'classic') {
            if (rowWork) rowWork.classList.add("hidden-row");
            if (rowBook) rowBook.classList.add("hidden-row");
            if (rowChapter) rowChapter.classList.add("hidden-row");
            if (rowSection) {
                if (isDramaOrPoetry) rowSection.classList.add("hidden-row");
                else rowSection.classList.remove("hidden-row");
            }
        } else {
            if (rowWork) rowWork.classList.remove("hidden-row");
            if (rowChapter) rowChapter.classList.remove("hidden-row");
            if (rowSection) {
                if (isDramaOrPoetry) rowSection.classList.add("hidden-row");
                else rowSection.classList.remove("hidden-row");
            }
            if (rowBook) {
                if (isFlatStructure(activeWorkKey)) rowBook.classList.add("hidden-row");
                else rowBook.classList.remove("hidden-row");
            }
        }

        const workContainer = document.getElementById("work-items-container");
        if (workContainer) {
            workContainer.innerHTML = "";
            Object.keys(GLOBAL_STRUCTURES).forEach(wKey => {
                const a = document.createElement("a");
                if (wKey === "tlg0003.tlg001") a.innerText = "Thucydides (Histories)";
                else if (wKey === "tlg0086.tlg034") a.innerText = "Aristotle (Poetics)";
                else if (wKey === "tlg0011.tlg004") a.innerText = "Sophocles (Oedipus Tyrannus)";
                else a.innerText = wKey;
                
                if(wKey === activeWorkKey) a.className = "current";
                a.onclick = () => {
                    activeSectionFilter = null; activeWorkKey = wKey;
                    if (isFlatStructure(wKey)) {
                        resolveAndInjectUrn(`urn:cts:greekLit:${wKey}:${GLOBAL_STRUCTURES[wKey][0]}`);
                    } else {
                        const targetBook = Object.keys(GLOBAL_STRUCTURES[wKey])[0];
                        resolveAndInjectUrn(`urn:cts:greekLit:${wKey}:${targetBook}.${GLOBAL_STRUCTURES[wKey][targetBook][0]}`);
                    }
                };
                workContainer.appendChild(a);
            });
        }

        if (currentActiveMode !== 'classic' && !isFlatStructure(activeWorkKey)) {
            const bookContainer = document.getElementById("book-items-container");
            if (bookContainer) {
                bookContainer.innerHTML = "";
                Object.keys(GLOBAL_STRUCTURES[activeWorkKey]).forEach(bk => {
                    const a = document.createElement("a");
                    a.innerText = bk;
                    if(bk === payload.book) a.className = "current";
                    a.onclick = () => {
                        activeSectionFilter = null;
                        resolveAndInjectUrn(`urn:cts:greekLit:${activeWorkKey}:${bk}.${GLOBAL_STRUCTURES[activeWorkKey][bk][0]}`);
                    };
                    bookContainer.appendChild(a);
                });
            }
        }

        const bookLabelEl = document.getElementById("chapter-row-label");
        if (bookLabelEl) bookLabelEl.innerText = isDramaOrPoetry ? "Lines:" : "Chapters:";

        const chapterContainer = document.getElementById("chapter-items-container");
        if (chapterContainer) {
            chapterContainer.innerHTML = "";
            const chList = isFlatStructure(activeWorkKey) ? GLOBAL_STRUCTURES[activeWorkKey] : GLOBAL_STRUCTURES[activeWorkKey][payload.book];
            chList.forEach(ch => {
                const a = document.createElement("a");
                a.innerText = ch;
                if(ch === payload.chapter) a.className = "current";
                a.onclick = () => {
                    activeSectionFilter = null;
                    const nextUrn = payload.book ? `urn:cts:greekLit:${activeWorkKey}:${payload.book}.${ch}` : `urn:cts:greekLit:${activeWorkKey}:${ch}`;
                    resolveAndInjectUrn(nextUrn);
                };
                chapterContainer.appendChild(a);
            });
        }

        if (!isDramaOrPoetry) {
            const sectionContainer = document.getElementById("section-items-container");
            if (sectionContainer) {
                sectionContainer.innerHTML = "";
                Object.keys(payload.sections).forEach(sec => {
                    const a = document.createElement("a");
                    a.innerText = sec; a.className = "sec-pill";
                    if(sec === activeSectionFilter) a.classList.add("active-pill");
                    a.onclick = () => selectSectionDirectly(sec);
                    sectionContainer.appendChild(a);
                });
            }
        }

        const railNodesTarget = document.getElementById("rail-nodes-target");
        const railTitle = document.getElementById("rail-title");
        if (railNodesTarget) {
            railNodesTarget.innerHTML = "";
            if (isFlatStructure(activeWorkKey)) {
                railTitle.innerText = isDramaOrPoetry ? "Lines Tree" : "Chapters Tree";
                GLOBAL_STRUCTURES[activeWorkKey].forEach(ch => {
                    const n = document.createElement("div");
                    n.className = `rail-tree-item ${(!payload.book && payload.chapter === ch) ? 'active-rail-node' : ''}`;
                    n.innerText = isDramaOrPoetry ? `Lines ${ch}` : `Chapter ${ch}`;
                    n.onclick = () => { activeSectionFilter = null; resolveAndInjectUrn(`urn:cts:greekLit:${activeWorkKey}:${ch}`); };
                    railNodesTarget.appendChild(n);
                });
            } else {
                railTitle.innerText = `Book ${payload.book} Chapters`;
                Object.keys(GLOBAL_STRUCTURES[activeWorkKey][payload.book]).forEach(idx => {
                    const ch = GLOBAL_STRUCTURES[activeWorkKey][payload.book][idx];
                    const n = document.createElement("div");
                    n.className = `rail-tree-item ${(payload.book && payload.chapter === ch) ? 'active-rail-node' : ''}`;
                    n.innerText = `Chapter ${ch}`;
                    n.onclick = () => { activeSectionFilter = null; resolveAndInjectUrn(`urn:cts:greekLit:${activeWorkKey}:${payload.book}.${ch}`); };
                    railNodesTarget.appendChild(n);
                });
            }
        }
    }

    function renderActiveContentLayers(payload) {
        ['f', 'c1', 'c2', 'c3'].forEach(prefix => {
            const targetContainer = document.getElementById(`content_${prefix}`);
            if (!targetContainer) return;
            targetContainer.innerHTML = "";
            
            const vId = columnEditions[prefix];
            const activeEditionMeta = TEXT_REGISTRY[vId];
            const cssClass = activeEditionMeta ? activeEditionMeta.class : "english-text";
            const shortId = activeEditionMeta ? activeEditionMeta.short_id : vId;
            const isPoetry = isPoetryWork(activeWorkKey);
            
            Object.keys(payload.sections).forEach(sec => {
                const isHidden = activeSectionFilter !== null && activeSectionFilter !== sec;
                const row = document.createElement("div");
                row.className = `section-row s-idx-${sec} ${isHidden ? 'hidden-section' : ''}`;
                const txt = payload.sections[sec][shortId] || "<i>[Text range missing in alignment layer]</i>";
                const visualIndexLabel = isPoetry ? sec : `[${sec}]`;
                
                if (isPoetry) {
                    const wrapper = document.createElement("div");
                    wrapper.className = `${cssClass} poetry-grid-layout`;
                    const temp = document.createElement("div");
                    temp.innerHTML = txt;
                    
                    while (temp.firstChild) {
                        const child = temp.firstChild;
                        if (child.nodeType === Node.ELEMENT_NODE && child.classList.contains("verse-line")) {
                            const lineNum = child.getAttribute("data-line") || "";
                            const numCell = document.createElement("span");
                            numCell.className = "line-num-cell"; numCell.innerText = lineNum;
                            const textCell = document.createElement("div");
                            textCell.className = "line-text-cell"; textCell.innerHTML = child.innerHTML;
                            wrapper.appendChild(numCell);
                            wrapper.appendChild(textCell);
                            temp.removeChild(child);
                        } else {
                            if (child.nodeType === Node.ELEMENT_NODE) {
                                child.style.gridColumn = "1 / span 2"; child.style.display = "block";
                            }
                            wrapper.appendChild(child);
                        }
                    }
                    row.appendChild(wrapper);
                } else {
                    row.innerHTML = `
                        <div class="prose-inline-layout ${cssClass}">
                            <span class="prose-marker"><a href="javascript:void(0)" onclick="selectSectionDirectly('${sec}')">${visualIndexLabel}</a></span>
                            <div class="prose-body-inline">${txt}</div>
                        </div>
                    `;
                }
                targetContainer.appendChild(row);
            });

            const footer = document.createElement("div");
            footer.className = "viewport-footer-controls";
            let prevBtnHtml = "", nextBtnHtml = "";
            
            if (activeSectionFilter) {
                const secArray = Object.keys(payload.sections);
                const currentIdx = secArray.indexOf(activeSectionFilter);
                if (currentIdx > 0) {
                    prevBtnHtml = `<a onclick="selectSectionDirectly('${secArray[currentIdx-1]}')" class="action-btn">&larr; Previous [${secArray[currentIdx-1]}]</a>`;
                } else if (payload.navigation.prev) {
                    prevBtnHtml = `<a class="action-btn" onclick="loadAdjacentUrn('${payload.navigation.prev}', true)">&larr; Previous Segment</a>`;
                }
                if (currentIdx < secArray.length - 1) {
                    nextBtnHtml = `<a onclick="selectSectionDirectly('${secArray[currentIdx+1]}')" class="action-btn">Next [${secArray[currentIdx+1]}] &rarr;</a>`;
                } else if (payload.navigation.next) {
                    nextBtnHtml = `<a class="action-btn" onclick="loadAdjacentUrn('${payload.navigation.next}', false)">Next Segment &rarr;</a>`;
                }
            } else {
                if (payload.navigation.prev) prevBtnHtml = `<a class="action-btn" onclick="loadAdjacentUrn('${payload.navigation.prev}')">&larr; Previous Segment</a>`;
                if (payload.navigation.next) nextBtnHtml = `<a class="action-btn" onclick="loadAdjacentUrn('${payload.navigation.next}')">Next Chapter &rarr;</a>`;
            }

            footer.innerHTML = `
                <div class="footer-group-left">
                    ${prevBtnHtml}
                    <a href="javascript:void(0)" class="action-btn secondary" onclick="clearSectionFilter(event)">Full View</a>
                </div>
                ${nextBtnHtml}
            `;
            const targetGrid = targetContainer.querySelector(".poetry-grid-layout");
            if (targetGrid && isPoetry) targetGrid.appendChild(footer); else targetContainer.appendChild(footer);
        });
    }

    window.loadAdjacentUrn = function(urn, selectLastSection = false) {
        activeSectionFilter = null;
        if (selectLastSection) {
            if (WORKSPACE_DATA_REGISTRY.has(urn)) {
                const data = WORKSPACE_DATA_REGISTRY.get(urn);
                const secs = Object.keys(data.sections);
                activeSectionFilter = secs.length > 0 ? secs[secs.length - 1] : null;
                triggerRenderLifecycle(urn);
            } else {
                const parts = urn.split(":");
                const workComponents = parts[3].split(".");
                const passageComponents = parts[4].split(".");
                const script = document.createElement("script");
                const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                
                if (passageComponents.length > 1 && !isFlatStructure(`${workComponents[0]}.${workComponents[1]}`)) {
                    script.src = `${basePath}corpus/${workComponents[0]}/${workComponents[1]}/chunks/chunk_b${passageComponents[0]}_ch${passageComponents[1]}.js`;
                } else {
                    script.src = `${basePath}corpus/${workComponents[0]}/${workComponents[1]}/chunks/chunk_ch${passageComponents[0]}.js`;
                }
                script.onload = () => {
                    const data = WORKSPACE_DATA_REGISTRY.get(urn);
                    const secs = Object.keys(data.sections);
                    activeSectionFilter = secs.length > 0 ? secs[secs.length - 1] : null;
                    triggerRenderLifecycle(urn);
                };
                document.head.appendChild(script);
            }
        } else {
            resolveAndInjectUrn(urn);
        }
    };

    window.clearSectionFilter = function(e) {
        if(e) e.preventDefault();
        activeSectionFilter = null;
        if (WORKSPACE_DATA_REGISTRY.has(activeUrnContext)) triggerRenderLifecycle(activeUrnContext);
    };

    window.updateColumnContent = function(prefix, value) {
        columnEditions[prefix] = value;
        if (activeUrnContext && WORKSPACE_DATA_REGISTRY.has(activeUrnContext)) {
            const payload = WORKSPACE_DATA_REGISTRY.get(activeUrnContext);
            updateURLState(payload.book, payload.chapter);
            renderActiveContentLayers(payload);
        }
    };
  
    let fourthColumnActive = false;

    window.toggleFourthColumn = function() {
        fourthColumnActive = !fourthColumnActive;
        const btn = document.getElementById('btn-toggle-col4');
        const ow = document.getElementById('outer-wrapper');
        if (fourthColumnActive) {
            ow.classList.add('four-columns');
            btn.classList.add('active-mode');
            btn.innerText = '−Col 4';
        } else {
            ow.classList.remove('four-columns');
            btn.classList.remove('active-mode');
            btn.innerText = '+Col 4';
        }
        updateClassicGridForColumns();
        if (fourthColumnActive && activeUrnContext && WORKSPACE_DATA_REGISTRY.has(activeUrnContext)) {
            const payload = WORKSPACE_DATA_REGISTRY.get(activeUrnContext);
            renderActiveContentLayers(payload);
        }
        document.querySelectorAll('.reading-column').forEach(col => {
            col.style.flex = '';
            col.style.width = '';
        });
        const mc = document.getElementById('main-container');
        if (mc) { mc.style.gridTemplateColumns = ''; mc.style.gridTemplateRows = ''; }
    };

    function updateClassicGridForColumns() {
        const ow = document.getElementById('outer-wrapper');
        const colF = document.getElementById('col_f');
        if (!ow || !ow.classList.contains('mode-classic')) return;
        if (fourthColumnActive) {
            if (colF) colF.style.gridRow = '1 / span 3';
        } else {
            if (colF) colF.style.gridRow = '1 / span 2';
        }
    }

    window.swapToFocus = function(sourcePrefix) {
        const focusEdition = columnEditions['f'];
        const sourceEdition = columnEditions[sourcePrefix];
        
        columnEditions['f'] = sourceEdition;
        columnEditions[sourcePrefix] = focusEdition;
        
        const selectF = document.getElementById('select_f');
        const selectSrc = document.getElementById('select_' + sourcePrefix);
        if (selectF) selectF.value = sourceEdition;
        if (selectSrc) selectSrc.value = focusEdition;
        
        if (activeUrnContext && WORKSPACE_DATA_REGISTRY.has(activeUrnContext)) {
            const payload = WORKSPACE_DATA_REGISTRY.get(activeUrnContext);
            updateURLState(payload.book, payload.chapter);
            renderActiveContentLayers(payload);
        }
    };

    // ── Panel Resize Logic ──────────────────────────────────────────────────
    (function() {
        function initResizeHandles() {
            const handles = document.querySelectorAll('.resize-handle');
            handles.forEach(handle => {
                handle.addEventListener('mousedown', startResize);
                handle.addEventListener('touchstart', startResize, {passive: false});
            });
        }

        function startResize(e) {
            e.preventDefault();
            const handle = e.currentTarget;
            const isHorizontal = handle.classList.contains('resize-handle-h');
            const container = document.getElementById('main-container');
            const outerWrapper = document.getElementById('outer-wrapper');
            const isClassic = outerWrapper.classList.contains('mode-classic');

            handle.classList.add('dragging');
            document.body.classList.add(isHorizontal ? 'resizing-cols' : 'resizing-rows');

            if (isClassic) {
                handleClassicResize(e, handle, container);
            } else {
                handleParallelResize(e, handle, container, isHorizontal);
            }
        }

        function handleParallelResize(startEvent, handle, container, isHorizontal) {
            const columns = Array.from(container.querySelectorAll('.reading-column'));
            const handleEl = handle;
            const handleIndex = Array.from(container.children).indexOf(handleEl);
            const prevCol = container.children[handleIndex - 1];
            const nextCol = container.children[handleIndex + 1];
            if (!prevCol || !nextCol) return;

            const containerRect = container.getBoundingClientRect();
            const startX = (startEvent.touches ? startEvent.touches[0] : startEvent).clientX;
            const startY = (startEvent.touches ? startEvent.touches[0] : startEvent).clientY;
            const prevStart = prevCol.getBoundingClientRect().width;
            const nextStart = nextCol.getBoundingClientRect().width;

            columns.forEach(col => {
                const w = col.getBoundingClientRect().width;
                col.style.flex = 'none';
                col.style.width = w + 'px';
            });

            function onMove(e) {
                const clientX = (e.touches ? e.touches[0] : e).clientX;
                const dx = clientX - startX;
                const newPrev = Math.max(100, prevStart + dx);
                const newNext = Math.max(100, nextStart - dx);
                prevCol.style.width = newPrev + 'px';
                nextCol.style.width = newNext + 'px';
            }

            function onEnd() {
                handleEl.classList.remove('dragging');
                document.body.classList.remove('resizing-cols', 'resizing-rows');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, {passive: false});
            document.addEventListener('touchend', onEnd);
        }

        function handleClassicResize(startEvent, handle, container) {
            const outerWrapper = document.getElementById('outer-wrapper');
            const containerRect = container.getBoundingClientRect();
            const startX = (startEvent.touches ? startEvent.touches[0] : startEvent).clientX;
            const startY = (startEvent.touches ? startEvent.touches[0] : startEvent).clientY;

            const style = getComputedStyle(container);
            const colWidths = style.gridTemplateColumns.split(' ').map(parseFloat);
            const rowHeights = style.gridTemplateRows.split(' ').map(parseFloat);

            const handleId = handle.id;

            function onMove(e) {
                const clientX = (e.touches ? e.touches[0] : e).clientX;
                const clientY = (e.touches ? e.touches[0] : e).clientY;

                if (handleId === 'resize-f-c1') {
                    const dx = clientX - startX;
                    const totalW = colWidths[0] + colWidths[1];
                    const newLeft = Math.max(150, Math.min(totalW - 150, colWidths[0] + dx));
                    const newRight = totalW - newLeft;
                    container.style.gridTemplateColumns = newLeft + 'px ' + newRight + 'px';
                    positionClassicHandles();
                } else if (handleId === 'resize-c1-c2') {
                    const dy = clientY - startY;
                    const totalH = rowHeights[0] + rowHeights[1];
                    const newTop = Math.max(80, Math.min(totalH - 80, rowHeights[0] + dy));
                    const newBot = totalH - newTop;
                    container.style.gridTemplateRows = newTop + 'px ' + newBot + 'px';
                    positionClassicHandles();
                }
            }

            function onEnd() {
                handle.classList.remove('dragging');
                document.body.classList.remove('resizing-cols', 'resizing-rows');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, {passive: false});
            document.addEventListener('touchend', onEnd);
        }

        const origSetMode = window.setWorkspaceLayoutMode;
        window.setWorkspaceLayoutMode = function(mode) {
            document.querySelectorAll('.reading-column').forEach(col => {
                col.style.flex = '';
                col.style.width = '';
            });
            const mc = document.getElementById('main-container');
            if (mc) {
                mc.style.gridTemplateColumns = '';
                mc.style.gridTemplateRows = '';
            }
            origSetMode(mode);
        };

        function createClassicOverlayHandles() {
            const mc = document.getElementById('main-container');
            if (!mc) return;

            let vHandle = document.getElementById('classic-resize-col');
            if (!vHandle) {
                vHandle = document.createElement('div');
                vHandle.id = 'classic-resize-col';
                vHandle.className = 'resize-handle resize-handle-h';
                vHandle.style.cssText = 'position:absolute; top:0; bottom:0; z-index:25;';
                mc.style.position = 'relative';
                mc.appendChild(vHandle);
                vHandle.addEventListener('mousedown', classicColResize);
                vHandle.addEventListener('touchstart', classicColResize, {passive:false});
            }

            let hHandle = document.getElementById('classic-resize-row');
            if (!hHandle) {
                hHandle = document.createElement('div');
                hHandle.id = 'classic-resize-row';
                hHandle.className = 'resize-handle resize-handle-v';
                hHandle.style.cssText = 'position:absolute; left:0; right:0; z-index:25;';
                mc.appendChild(hHandle);
                hHandle.addEventListener('mousedown', classicRowResize);
                hHandle.addEventListener('touchstart', classicRowResize, {passive:false});
            }
            positionClassicHandles();
        }

        function positionClassicHandles() {
            const mc = document.getElementById('main-container');
            const colF = document.getElementById('col_f');
            const colC1 = document.getElementById('col_c1');
            if (!mc || !colF || !colC1) return;
            const ow = document.getElementById('outer-wrapper');
            if (!ow || !ow.classList.contains('mode-classic')) return;

            const mcRect = mc.getBoundingClientRect();
            const fRect = colF.getBoundingClientRect();
            const c1Rect = colC1.getBoundingClientRect();

            const vHandle = document.getElementById('classic-resize-col');
            if (vHandle) {
                vHandle.style.left = (fRect.right - mcRect.left - 2) + 'px';
            }

            const hHandle = document.getElementById('classic-resize-row');
            if (hHandle) {
                hHandle.style.top = (c1Rect.bottom - mcRect.top - 2) + 'px';
                hHandle.style.left = (fRect.right - mcRect.left + 3) + 'px';
                hHandle.style.right = '0';
            }
        }

        function classicColResize(startEvent) {
            startEvent.preventDefault();
            const mc = document.getElementById('main-container');
            const handle = document.getElementById('classic-resize-col');
            handle.classList.add('dragging');
            document.body.classList.add('resizing-cols');
            const style = getComputedStyle(mc);
            const colWidths = style.gridTemplateColumns.split(' ').map(parseFloat);
            const startX = (startEvent.touches ? startEvent.touches[0] : startEvent).clientX;

            function onMove(e) {
                const clientX = (e.touches ? e.touches[0] : e).clientX;
                const dx = clientX - startX;
                const totalW = colWidths[0] + colWidths[1];
                const newLeft = Math.max(150, Math.min(totalW - 150, colWidths[0] + dx));
                const newRight = totalW - newLeft;
                mc.style.gridTemplateColumns = newLeft + 'px ' + newRight + 'px';
                positionClassicHandles();
            }
            function onEnd() {
                handle.classList.remove('dragging');
                document.body.classList.remove('resizing-cols');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, {passive:false});
            document.addEventListener('touchend', onEnd);
        }

        function classicRowResize(startEvent) {
            startEvent.preventDefault();
            const mc = document.getElementById('main-container');
            const handle = document.getElementById('classic-resize-row');
            handle.classList.add('dragging');
            document.body.classList.add('resizing-rows');
            const style = getComputedStyle(mc);
            const rowHeights = style.gridTemplateRows.split(' ').map(parseFloat);
            const startY = (startEvent.touches ? startEvent.touches[0] : startEvent).clientY;

            function onMove(e) {
                const clientY = (e.touches ? e.touches[0] : e).clientY;
                const dy = clientY - startY;
                const totalH = rowHeights[0] + rowHeights[1];
                const newTop = Math.max(80, Math.min(totalH - 80, rowHeights[0] + dy));
                const newBot = totalH - newTop;
                mc.style.gridTemplateRows = newTop + 'px ' + newBot + 'px';
                positionClassicHandles();
            }
            function onEnd() {
                handle.classList.remove('dragging');
                document.body.classList.remove('resizing-rows');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, {passive:false});
            document.addEventListener('touchend', onEnd);
        }

        const modeObserver = new MutationObserver(function() {
            const ow = document.getElementById('outer-wrapper');
            if (!ow) return;
            const isClassic = ow.classList.contains('mode-classic');
            const h1 = document.getElementById('resize-f-c1');
            const h2 = document.getElementById('resize-c1-c2');
            const h3 = document.getElementById('resize-c2-c3');
            const ch = document.getElementById('classic-resize-col');
            const rh = document.getElementById('classic-resize-row');
            if (isClassic) {
                if (h1) h1.style.display = 'none';
                if (h2) h2.style.display = 'none';
                if (h3) h3.style.display = 'none';
                createClassicOverlayHandles();
                if (ch) ch.style.display = '';
                if (rh) rh.style.display = '';
                setTimeout(positionClassicHandles, 50);
            } else {
                if (h1) { h1.style.display = ''; }
                if (h2) { h2.style.display = ''; }
                if (h3) { h3.style.display = fourthColumnActive ? '' : 'none'; }
                if (ch) ch.style.display = 'none';
                if (rh) rh.style.display = 'none';
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            initResizeHandles();
            const ow = document.getElementById('outer-wrapper');
            if (ow) {
                modeObserver.observe(ow, { attributes: true, attributeFilter: ['class'] });
            }
            window.addEventListener('resize', positionClassicHandles);
        });
    })();
  </script>
