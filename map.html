<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perseus Workspace Engine | Map</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #header {
            padding: 12px 20px;
            background-color: #660000;
            color: #fff;
            font-family: Georgia, serif;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
        }
        #header h2 { margin: 0 0 4px; font-size: 1.2rem; }
        #header p { margin: 0; font-size: 0.85rem; color: #f0d8d8; }
        #header-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        #back-link {
            color: #fff;
            font-size: 0.85rem;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 4px;
            padding: 5px 10px;
            white-space: nowrap;
        }
        #back-link:hover { background: rgba(255,255,255,0.15); }
        #next-section-btn {
            font-size: 0.85rem;
            color: #660000;
            background: #fff;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            white-space: nowrap;
        }
        #next-section-btn:hover { background: #f0d8d8; }
        #next-section-btn:disabled { opacity: 0.5; cursor: default; }
        #label-toggle-row {
            font-size: 0.8rem;
            color: #f0d8d8;
            white-space: nowrap;
        }
        #label-toggle-row input { margin-right: 4px; vertical-align: middle; }
        #status { padding: 16px 20px; font-size: 14px; color: #555; }
        #map-row { display: flex; height: calc(100vh - 64px); }
        #map { flex: 1 1 auto; min-width: 0; }
        #place-panel {
            width: 320px;
            flex: 0 0 320px;
            border-left: 1px solid #ddd;
            overflow-y: auto;
            background: #faf8f5;
        }
        #place-panel.collapsed { display: none; }
        #place-panel-header {
            padding: 10px 14px;
            background: #660000;
            color: #fff;
            font-family: Georgia, serif;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #place-panel-count {
            background: rgba(255,255,255,0.25);
            border-radius: 10px;
            padding: 1px 8px;
            font-size: 0.75rem;
            font-weight: normal;
        }
        .place-row {
            padding: 8px 14px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .place-row:hover { background: #f0e6e0; }
        .place-row-name { font-weight: bold; color: #660000; }
        .place-row-meta { color: #888; font-size: 0.78rem; margin-top: 2px; }
        #panel-toggle-btn {
            font-size: 0.8rem;
            color: #660000;
            background: #fff;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            white-space: nowrap;
        }
        .attribution-note { font-size: 11px; color: #888; padding: 4px 20px; }
        .map-legend {
            background: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.35);
            font-size: 12px;
            line-height: 1.7;
            font-family: Arial, sans-serif;
        }
        .map-legend strong { font-size: 12px; }
        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .place-label {
            background: rgba(255,255,255,0.85);
            border: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.25);
            font-size: 11px;
            padding: 1px 5px;
        }
        .place-label::before { display: none; } /* hide the little tooltip arrow -- cleaner with many labels on screen */
        #map.hide-labels .place-label { display: none; }
    </style>
</head>
<body>

    <div id="header">
        <div>
            <h2 id="passage-title">Loading passage…</h2>
            <p id="passage-subtitle">Places attested here (ToposText)</p>
        </div>
        <div id="header-nav">
            <label id="label-toggle-row">
                <input type="checkbox" id="label-toggle" checked onchange="onLabelToggle(this.checked)">
                Show place names
            </label>
            <button id="panel-toggle-btn" onclick="onPanelToggle()">Hide place list</button>
            <button id="next-section-btn" onclick="goToNextSection()" style="display:none;">Next section &rarr;</button>
            <a id="back-link" href="./index.html">&larr; Perseus Multitext Viewer</a>
        </div>
    </div>

    <div id="status"></div>
    <div id="map-row" style="display:none;">
        <div id="map"></div>
        <div id="place-panel">
            <div id="place-panel-header">
                <span>Places in this scope</span>
                <span id="place-panel-count"></span>
            </div>
            <div id="place-panel-list"></div>
        </div>
    </div>

    <script>
    function setStatus(html) {
        document.getElementById("status").innerHTML = html;
    }

    // Current passage state, set once in main() and reused by the
    // back-link and next-section navigation -- avoids threading these
    // through every function or re-parsing the URL repeatedly.
    let currentWorkKey = null, currentBook = null, currentChapter = null, currentDb = null;
    let currentMapInstance = null;

    function onLabelToggle(checked) {
        document.getElementById("map").classList.toggle("hide-labels", !checked);
    }

    function onPanelToggle() {
        const panel = document.getElementById("place-panel");
        const btn = document.getElementById("panel-toggle-btn");
        const collapsed = panel.classList.toggle("collapsed");
        btn.textContent = collapsed ? "Show place list" : "Hide place list";
        // Leaflet needs to know its container resized, or tiles render
        // incorrectly cropped until the next manual pan/zoom.
        if (currentMapInstance) {
            setTimeout(() => currentMapInstance.invalidateSize(), 0);
        }
    }

    async function goToNextSection() {
        if (!currentDb || !currentChapter) return;
        const next = nextPassage(currentDb, currentBook, currentChapter);
        if (!next) return; // already at the end -- button should be disabled in this case anyway
        const params = new URLSearchParams({ work: currentWorkKey, chapter: next.chapter });
        if (next.book) params.set("book", next.book);
        window.location.href = `./map.html?${params.toString()}`;
    }

    // Place boundary polygons (e.g. Attika, Persia), keyed by the same
    // ToposText place_id used in place_references. This is global,
    // work-independent reference data -- a region's shape doesn't
    // change depending on which text is open -- so it's loaded once
    // from a single shared file rather than being part of any per-work
    // shard. Falls back to an empty map (i.e. every place renders as a
    // point) if the file doesn't exist yet, the same graceful-degrade
    // pattern used everywhere else in this pipeline.
    let PLACE_POLYGONS = null;
    async function loadPlacePolygons() {
        if (PLACE_POLYGONS !== null) return PLACE_POLYGONS;
        try {
            const r = await fetch(`./${DATA_DIR}/place_polygons.geojson`, { cache: "no-store" });
            if (!r.ok) { PLACE_POLYGONS = new Map(); return PLACE_POLYGONS; }
            const geojson = await r.json();
            const map = new Map();
            for (const feat of (geojson.features || [])) {
                const pid = feat.properties && feat.properties.place_id;
                if (pid && feat.geometry) map.set(String(pid), feat.geometry);
            }
            PLACE_POLYGONS = map;
        } catch (e) {
            console.warn("Could not load place polygon data (falling back to points only):", e);
            PLACE_POLYGONS = new Map();
        }
        return PLACE_POLYGONS;
    }

    // Visual encoding for mention type. A "place" mention is the most
    // literal (the passage names the location directly); "ethnic" and
    // "demonym" are people/group mentions that carry an associated
    // homeland. "person" is excluded by default upstream (see the
    // ingestion cell) but kept here for completeness in case a caller
    // ever passes --types=...,person.
    const TYPE_COLORS = {
        place: "#660000",
        ethnic: "#3a6ea5",
        demonym: "#b8860b",
        person: "#5a5a5a"
    };
    const TYPE_LABELS = {
        place: "Place",
        ethnic: "Ethnic group",
        demonym: "Demonym",
        person: "Person (associated place)"
    };
    // A single place can be mentioned as more than one type across
    // different mentions/chapters (e.g. once as a literal "place", once
    // as an "ethnic" reference). The marker's color reflects whichever
    // type is highest priority among that place's mentions -- the
    // popup itself still lists every mention with its own type/color,
    // so nothing is hidden, this just picks one color for the pin.
    const TYPE_PRIORITY = ["place", "ethnic", "demonym", "person"];
    function primaryTypeFor(mentions) {
        for (const t of TYPE_PRIORITY) {
            if (mentions.some(m => m.type === t)) return t;
        }
        return (mentions[0] && mentions[0].type) || "place";
    }

    // De-duplicates by place_id (a place mentioned several times in one
    // scope should get one pin, not several stacked on top of each
    // other), while keeping every distinct mention name/type/chapter so
    // the popup can list all of them. `chapter` per mention matters once
    // the scope spans more than one chapter (book/whole-work views) --
    // for a single-chapter view every mention naturally shares the same
    // chapter, so the caller can choose not to display it.
    function groupByPlace(rows) {
        const byPlace = new Map();
        for (const r of rows) {
            if (r.lat == null || r.lon == null) continue; // no coordinates -- can't plot
            if (!byPlace.has(r.place_id)) {
                byPlace.set(r.place_id, {
                    place_id: r.place_id,
                    place_name: r.place_name,
                    lat: r.lat,
                    lon: r.lon,
                    feature_type: r.feature_type,
                    mentions: []
                });
            }
            byPlace.get(r.place_id).mentions.push({ name: r.mention_name, type: r.mention_type, chapter: r.chapter });
        }
        return Array.from(byPlace.values());
    }

    function addLegend(map, places) {
        const typesPresent = new Set(places.map(p => primaryTypeFor(p.mentions)));
        if (typesPresent.size === 0) return;
        // Only mention the dashed-region convention if it's actually
        // relevant right now -- a region here means "shown as an
        // approximate point, no polygon yet"; places whose region DOES
        // have real polygon data render as an actual shape instead and
        // don't need this note.
        const hasApproxRegion = places.some(p =>
            (p.feature_type || "").toLowerCase().includes("region"));
        const legend = L.control({ position: "bottomright" });
        legend.onAdd = function () {
            const div = L.DomUtil.create("div", "map-legend");
            let html = "<strong>Mention type</strong><br/>";
            for (const t of TYPE_PRIORITY) {
                if (!typesPresent.has(t)) continue;
                html += `<span class="legend-dot" style="background:${TYPE_COLORS[t]};"></span>${TYPE_LABELS[t]}<br/>`;
            }
            if (hasApproxRegion) {
                html += `<span class="legend-dot" style="background:#fff;border:2px dashed #660000;box-sizing:border-box;"></span>` +
                        `Region (approximate point -- no boundary data yet)<br/>`;
            }
            div.innerHTML = html;
            return div;
        };
        legend.addTo(map);
    }

    // AWMC/CAWM's basemap only covers the Mediterranean Basin and Near
    // East (it's a physical-geography map built for the ancient
    // Mediterranean world, not a general modern basemap). Rather than
    // picking a basemap per-work, we check the actual place coordinates
    // for this scope -- so a Thucydides chapter that dips one place
    // outside the box (rare, but possible) falls back gracefully rather
    // than silently rendering blank tiles at the edge. Box is generous
    // on purpose (roughly Iberia/Britain to Persia, Egypt to the Black
    // Sea) -- better to include some places CAWM only sparsely covers
    // than to bounce a genuinely Mediterranean text to the wrong map.
    const AWMC_BOUNDS = L.latLngBounds([[10, -12], [50, 63]]);

    // Fill in a free key from https://carto.com/basemaps/apikey once
    // requested -- see the map notes for why this is here.
    const CARTO_API_KEY = "";

    function addBasemap(map, places) {
        const withinAwmc = places.length > 0 &&
            places.every(p => AWMC_BOUNDS.contains([p.lat, p.lon]));

        if (withinAwmc) {
            L.tileLayer('https://cawm.lib.uiowa.edu/tiles/{z}/{x}/{y}.png', {
                attribution: 'Map tiles &copy; <a href="https://cawm.lib.uiowa.edu">Consortium of Ancient World Mappers</a> (CC BY 4.0) | Place data: ToposText (topostext.org)',
                maxZoom: 12
            }).addTo(map);
        } else {
            const keyParam = CARTO_API_KEY ? `?api_key=${CARTO_API_KEY}` : "";
            L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png${keyParam}`, {
                attribution: 'OpenStreetMap contributors, CARTO | Place data: ToposText (topostext.org)',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);
        }
    }

    function renderMap(places, scopeLabel, showChapterPerMention, polygons) {
        document.getElementById("status").style.display = "none";
        document.getElementById("map-row").style.display = "flex";

        const map = L.map('map').setView([38.0, 23.7], 6);
        currentMapInstance = map;
        addBasemap(map, places);

        // Clustering matters most for wide scopes (a whole book, or an
        // entire work) where dozens of pins can land close together;
        // for a single-chapter view it just quietly does nothing extra
        // since there's rarely more than a handful of places. Polygons
        // (regions we have real boundary data for) are NOT clustered --
        // a large region shape shouldn't get swallowed into a numbered
        // cluster bubble alongside nearby point markers.
        const clusterGroup = L.markerClusterGroup({
            maxClusterRadius: 40,
            spiderfyOnMaxZoom: true
        });
        const polygonLayers = [];
        // Per-place layer + kind, so the side panel can jump to
        // whichever place a row represents -- markers go through the
        // cluster group's own zoomToShowLayer (so a marker currently
        // folded into a collapsed cluster bubble gets properly expanded
        // to before its popup opens), polygons just get their bounds
        // fitted directly.
        const layerByPlaceId = new Map();

        for (const p of places) {
            const primaryType = primaryTypeFor(p.mentions);
            const color = TYPE_COLORS[primaryType] || TYPE_COLORS.place;

            const mentionList = p.mentions
                .map(m => {
                    const dot = `<span class="legend-dot" style="background:${TYPE_COLORS[m.type] || '#999'};"></span>`;
                    return showChapterPerMention
                        ? `${dot}${m.name} <span style="color:#888;">(${m.type}, ${m.chapter})</span>`
                        : `${dot}${m.name} <span style="color:#888;">(${m.type})</span>`;
                })
                .join("<br/>");
            const popupHtml =
                `<div style="font-size:14px;"><strong>${p.place_name}</strong><br/>` +
                `<span style="color:#888;">Mentioned in ${scopeLabel} as:</span><br/>${mentionList}</div>`;

            // Full ZDISPLAYNAME strings are long ("Boiotia region
            // (Boeotia) 1673 Viotia - Βοιωτία") -- fine for a popup,
            // too cluttered as an always-visible on-map label. Just the
            // part before the first parenthesis reads cleanly on the
            // map itself; the popup still shows the full name on click.
            const shortLabel = (p.place_name || "").split("(")[0].trim() || p.place_name;

            const geometry = polygons.get(String(p.place_id));
            if (geometry) {
                // A region we have a real boundary for (e.g. Attika,
                // Persia) renders as its actual shape instead of a
                // single representative point.
                const layer = L.geoJSON({ type: "Feature", geometry, properties: {} }, {
                    style: { color: color, weight: 2, fillColor: color, fillOpacity: 0.25 }
                });
                layer.bindPopup(popupHtml);
                layer.bindTooltip(shortLabel, { permanent: true, direction: "center", className: "place-label" });
                layer.addTo(map);
                polygonLayers.push(layer);
                layerByPlaceId.set(p.place_id, { kind: "polygon", layer });
            } else {
                // Regions (feature_type like "region/people") get a
                // visually distinct style -- larger, dashed outline,
                // lower fill -- reading as an approximate area standing
                // in for the place until real polygon data exists,
                // rather than a precise site. This is a SEPARATE visual
                // channel from color (still mention type), not a
                // replacement for it.
                const isRegion = (p.feature_type || "").toLowerCase().includes("region");
                const markerStyle = isRegion
                    ? { radius: 11, fillColor: color, color: color, weight: 2, dashArray: "3,3", opacity: 0.9, fillOpacity: 0.35 }
                    : { radius: 8, fillColor: color, color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.85 };
                const marker = L.circleMarker([p.lat, p.lon], markerStyle);
                marker.bindPopup(popupHtml);
                marker.bindTooltip(shortLabel, { permanent: true, direction: "right", className: "place-label", offset: [8, 0] });
                clusterGroup.addLayer(marker);
                layerByPlaceId.set(p.place_id, { kind: "marker", layer: marker });
            }
        }
        map.addLayer(clusterGroup);

        // Combine bounds from points (via the cluster group) and
        // polygons, so the view fits everything present rather than
        // just whichever kind happens to exist in this scope.
        const allBounds = L.latLngBounds([]);
        if (clusterGroup.getLayers().length > 0) allBounds.extend(clusterGroup.getBounds());
        polygonLayers.forEach(layer => allBounds.extend(layer.getBounds()));
        if (allBounds.isValid()) {
            map.fitBounds(allBounds, { padding: [50, 50] });
        }

        addLegend(map, places);

        // Side panel: a scannable list of every place in this scope,
        // sorted alphabetically, each row jumping straight to its place
        // on click -- addresses the "too much work to hunt and click
        // each dot" complaint more directly than the on-map labels
        // alone can for a busy scope.
        const sorted = places.slice().sort((a, b) =>
            (a.place_name || "").localeCompare(b.place_name || ""));
        document.getElementById("place-panel-count").textContent = `${places.length} present`;
        const listEl = document.getElementById("place-panel-list");
        listEl.innerHTML = "";
        for (const p of sorted) {
            const shortLabel = (p.place_name || "").split("(")[0].trim() || p.place_name;
            const chapters = [...new Set(p.mentions.map(m => m.chapter))].join(", ");
            const row = document.createElement("div");
            row.className = "place-row";
            row.innerHTML =
                `<div class="place-row-name">${shortLabel}</div>` +
                `<div class="place-row-meta">${chapters}</div>`;
            row.onclick = () => {
                const entry = layerByPlaceId.get(p.place_id);
                if (!entry) return;
                if (entry.kind === "polygon") {
                    map.fitBounds(entry.layer.getBounds(), { maxZoom: 10 });
                    entry.layer.openPopup();
                } else {
                    clusterGroup.zoomToShowLayer(entry.layer, () => entry.layer.openPopup());
                }
            };
            listEl.appendChild(row);
        }
    }

    async function main() {
        const params = new URLSearchParams(window.location.search);
        const workKey = params.get("work");
        const chapter = params.get("chapter");
        const book = params.get("book");
        const whole = params.get("whole");

        if (!workKey || (!chapter && !book && !whole)) {
            setStatus("No passage specified. Open this page from the reader's " +
                       "\u201cMap this passage\u201d or \u201cMap this book\u201d button rather than directly.");
            return;
        }

        currentWorkKey = workKey;
        currentBook = book;
        currentChapter = chapter;

        // Back-link to the reader: round-trips to the exact same passage
        // when we're in single-chapter mode (using the same "w=work:book.
        // chapter" scheme the reader's own updateURLState writes, so this
        // is a normal deep link, not a special case); for book/whole-work
        // scope there's no single chapter to return to, so it links back
        // to the work generally instead.
        const backLink = document.getElementById("back-link");
        if (chapter) {
            // `chapter` is already the folded "book.chapter" string for
            // prose works (e.g. "1.41") -- prepending book again would
            // double it up ("1.1.41"). Only prepend book when chapter is
            // a bare poetry card label (no dot), matching the same
            // has-a-dot check used elsewhere for this exact distinction.
            const passageValue = (book && !chapter.includes(".")) ? `${book}.${chapter}` : chapter;
            backLink.href = `./index.html?w=${encodeURIComponent(workKey + ":" + passageValue)}`;
        } else {
            backLink.href = `./index.html?w=${encodeURIComponent(workKey)}`;
        }

        const scopeLabel = chapter ? chapter : (book ? `Book ${book}` : "the entire work");

        // Display name comes from catalog.json (already fetched/cached by
        // the shared loadCatalog(), same data the main reader's splash
        // page uses) rather than a hardcoded map -- so this page never
        // needs its own copy of author/title data to keep in sync.
        let displayName = workKey;
        try {
            const catalog = await loadCatalog();
            const meta = (catalog.works || {})[workKey];
            const author = meta ? (catalog.authors || {})[meta.textgroup] : null;
            const title = meta ? meta.title : null;
            if (author && title) displayName = `${author}, ${title}`;
            else if (title) displayName = title;
        } catch (e) {
            console.warn("Could not load catalog.json for display name:", e);
        }

        document.getElementById("passage-title").textContent =
            `${displayName} \u2014 ${scopeLabel}`;

        setStatus("Loading map data\u2026");

        try {
            await new Promise((resolve, reject) => {
                initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` })
                    .then(SQL => { window.SQL_WASM_ENGINE = SQL; resolve(); })
                    .catch(reject);
            });

            const db = await getDbForWork(workKey, shardPathForWorkKey(workKey));
            currentDb = db;

            // "Next section" only makes sense in single-passage mode --
            // a book/whole-work view already spans everything, so there's
            // no single "next" to advance to. Checked once here (rather
            // than on click) so the button can be disabled up front if
            // we're already at the very end of the work.
            if (chapter) {
                const nextBtn = document.getElementById("next-section-btn");
                const next = nextPassage(db, book, chapter);
                if (next) {
                    nextBtn.style.display = "";
                    nextBtn.disabled = false;
                } else {
                    nextBtn.style.display = "";
                    nextBtn.disabled = true;
                    nextBtn.textContent = "End of work";
                }
            }

            let rows;
            try {
                if (chapter) rows = placesForChapter(db, chapter, book);
                else if (book) rows = placesForBook(db, book);
                else rows = placesForWork(db);
            } catch (e) {
                // Most likely cause: this work's shard doesn't have a
                // place_references table yet (pilot coverage is currently
                // Thucydides / Iliad / Agamemnon only). Distinguish that
                // from a genuine query bug rather than showing a raw
                // SQL error to the reader.
                if (/no such table/i.test(e.message || "")) {
                    setStatus("No place data is available for this text yet. " +
                               "Place coverage is currently limited to a small " +
                               "pilot set of works.");
                    return;
                }
                throw e;
            }

            if (rows.length === 0) {
                setStatus("No places are attested in this scope.");
                return;
            }

            const places = groupByPlace(rows);
            const polygons = await loadPlacePolygons();
            renderMap(places, scopeLabel, !chapter, polygons);

        } catch (e) {
            console.error(e);
            setStatus("Something went wrong loading the map: " + (e.message || e));
        }
    }

    // shard_loader.js is loaded dynamically with a cache-busting query
    // param, rather than a static <script src> tag -- a plain tag lets
    // browsers silently keep serving a stale cached copy even after the
    // file changes on disk (this bit us once already: nextPassage()
    // existed in the real file but the browser was still running an
    // older cached version with no such function). catalog.json already
    // avoids this the same way (see loadCatalog's own ?v=Date.now()).
    function loadScriptCacheBusted(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = `${src}?v=${Date.now()}`;
            s.onload = resolve;
            s.onerror = () => reject(new Error(`Failed to load ${src}`));
            document.head.appendChild(s);
        });
    }

    loadScriptCacheBusted("./shard_loader.js")
        .then(main)
        .catch(e => {
            console.error(e);
            setStatus("Something went wrong loading required scripts: " + (e.message || e));
        });
    </script>
