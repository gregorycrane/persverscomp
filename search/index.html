  { key: "upos",  label: "Part of speech", isUpos: true, options: ["VERB","AUX","NOUN","PROPN","ADJ","PRON","DET","ADV","ADP","NUM","CCONJ","SCONJ","PART","INTJ","PUNCT"] },
  { key: "Mood",    label: "Mood",     options: ["Ind","Sub","Opt","Imp"] },
  { key: "VerbForm",label: "Verb form",options: ["Fin","Inf","Part","Ger","Gdv"] },
  { key: "Tense",   label: "Tense",    options: ["Pres","Imp","Fut","Aor","Perf","Pqp"] },
  { key: "Voice",   label: "Voice",    options: ["Act","Mid","Pass"] },
  { key: "Person",  label: "Person",   options: ["1","2","3"] },
  { key: "Number",  label: "Number",   options: ["Sing","Plur","Dual"] },
  { key: "Case",    label: "Case",     options: ["Nom","Gen","Dat","Acc","Voc"] },
  { key: "Gender",  label: "Gender",   options: ["Masc","Fem","Neut"] },
  { key: "Degree",  label: "Degree",   options: ["Pos","Cmp","Sup"] },
];

let SQL = null;
const SHARDS = new Map(); // workKey -> { dbs: Database[], label, textgroup, work }
const TOTAL_TOKENS_BY_WORK = new Map(); // workKey -> total token count across all parts (denominator for rates)
let LAST_MATCHES = [];    // full match set from the most recent search

function setStatus(msg) { document.getElementById("status-bar").textContent = msg; }

function normKey(s) {
  if (!s) return "";
  let t = s.normalize("NFD").replace(/\p{Mn}/gu, "");
  t = t.normalize("NFC").toLowerCase();
  t = t.replace(/ς/g, "σ"); // final sigma -> medial
  return t;
}

// Splits the search box into one or more terms, so a reader can search a
// whole set of words at once ("ἄναξ, βασιλεύς, ἥρως") instead of one at a
// time. Spaces within a term are preserved (so a comma-free phrase like
// "rosy-fingered dawn" still searches as one unit); only comma/semicolon/
// newline act as separators. De-duplicated, order preserved.
function parseTermList(raw) {
  return [...new Set(raw.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean))];
}

function queryAll(db, sql, params = []) {
  const out = [];
  const st = db.prepare(sql);
  st.bind(params);
  while (st.step()) out.push(st.getAsObject());
  st.free();
  return out;
}

// ── Boot: load sql.js, then catalog, then eagerly fetch every shard that
// has treebank annotations (small corpus for now: Hesiod + Sophocles). ──
initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` })
  .then(async engine => {
    SQL = engine;
    setStatus("Loading catalog…");
    const r = await fetch(`${CONFIG.CATALOG_URL}?v=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("catalog.json not found at " + CONFIG.CATALOG_URL);
    const catalog = await r.json();

    const treebankWorks = Object.entries(catalog.works || {})
      .filter(([, meta]) => (meta.annotations && meta.annotations.treebanks > 0));

    if (treebankWorks.length === 0) {
      setStatus("No treebank-annotated works found in catalog.json.");
      return;
    }

    let loaded = 0;
    for (const [workKey, meta] of treebankWorks) {
      const [tg, wk] = workKey.split(".");
      // A work may be split into several book-range part files (see the
      // notebook's book-aware sharder) to stay under GitHub's 100MB
      // per-file limit. catalog.json's `parts` list is the source of
      // truth for which files make up a work; fall back to the old
      // single-file convention if a catalog predates that field.
      const partEntries = (Array.isArray(meta.parts) && meta.parts.length)
        ? meta.parts
        : [{ file: `${tg}.${wk}.part1.db` }]; // last-resort guess if catalog predates `parts`

      const dbs = [];
      let totalTokens = 0;
      for (const partEntry of partEntries) {
        const path = `${CONFIG.DATA_DIR}/${tg}/${wk}/${partEntry.file}`;
        setStatus(`Loading ${workKey} — part ${dbs.length + 1}/${partEntries.length}…`);
        try {
          const resp = await fetch(path);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const buf = new Uint8Array(await resp.arrayBuffer());
          const db = new SQL.Database(buf);
          dbs.push(db);
          try {
            const cnt = queryAll(db, "SELECT COUNT(*) AS n FROM treebank_tokens")[0];
            totalTokens += cnt ? cnt.n : 0;
          } catch (e) {
            // shard predates the treebank_tokens table -- leave at 0
          }
        } catch (e) {
          // A "last resort guess" entry not existing is expected/silent;
          // a real catalog-listed part failing to load is worth logging.
          if (Array.isArray(meta.parts) && meta.parts.length) {
            console.error(`Failed to load ${workKey} part ${partEntry.file}:`, e);
          }
        }
      }
      if (dbs.length === 0) {
        console.error(`No shard parts could be loaded for ${workKey}; skipping.`);
        continue;
      }

      const label = CONFIG.WORK_TITLES[workKey] || meta.label || workKey;
      SHARDS.set(workKey, { dbs, label, textgroup: tg, work: wk });
      TOTAL_TOKENS_BY_WORK.set(workKey, totalTokens);
      loaded++;
    }
    setStatus(`Ready — ${loaded} treebank-annotated work${loaded === 1 ? "" : "s"} loaded (${treebankWorks.map(w => w[0]).join(", ")}).`);
    console.table(Array.from(SHARDS.entries()).map(([wk, s]) => ({ workKey: wk, currentLabel: s.label, parts: s.dbs.length })));
    console.info("To fix a work's display name, add it to CONFIG.WORK_TITLES at the top of this file, e.g.:\n  \"tlg0012.tlg001\": \"Homer, Iliad\",");
    buildAdvancedPanel();
    buildWorkFilterTree();
    if (applyStateFromURL()) runSearch();
  })
  .catch(err => {
    console.error(err);
    setStatus("Error: " + err.message);
  });

function buildAdvancedPanel() {
  const panel = document.getElementById("advanced-panel");
  panel.innerHTML = "";
  for (const def of FEATURE_DEFS) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const label = document.createElement("label");
    label.textContent = def.label;
    label.setAttribute("for", "feat-" + def.key);
    const sel = document.createElement("select");
    sel.id = "feat-" + def.key;
    sel.dataset.key = def.key;
    sel.dataset.isUpos = def.isUpos ? "1" : "";
    sel.appendChild(new Option("any", ""));
    for (const v of def.options) sel.appendChild(new Option(v, v));
    wrap.appendChild(label); wrap.appendChild(sel);
    panel.appendChild(wrap);
  }
  const rawWrap = document.createElement("div");
  rawWrap.className = "field";
  rawWrap.innerHTML = `<label for="feat-raw">Raw feats filter (advanced)</label>
    <input type="text" id="feat-raw" placeholder="substring, e.g. Poss=Yes" style="min-width:180px;font-size:13px">`;
  panel.appendChild(rawWrap);
}

function toggleAdvanced() {
  document.getElementById("advanced-panel").classList.toggle("open");
}

// ── Work-filter checkbox tree: Genre (optional) > Author > Work ────────────
// Built once, after SHARDS is populated from catalog.json. Genre membership
// comes from CONFIG.GENRE_GROUPS (explicit, since it crosses textgroups and
// can't be derived structurally); Author grouping comes from CONFIG.WORK_
// AUTHORS keyed by textgroup, falling back to parsing the work's own title.
function authorLabelForTextgroup(tg, worksInGroup) {
  if (CONFIG.WORK_AUTHORS[tg]) return CONFIG.WORK_AUTHORS[tg];
  const first = worksInGroup[0];
  if (first && first.label.includes(",")) return first.label.split(",")[0].trim();
  return tg;
}

function buildWorkGroups() {
  const byTextgroup = new Map(); // tg -> [{key, label}]
  for (const [workKey, shard] of SHARDS.entries()) {
    const tg = shard.textgroup;
    if (!byTextgroup.has(tg)) byTextgroup.set(tg, []);
    byTextgroup.get(tg).push({ key: workKey, label: shard.label });
  }
  for (const works of byTextgroup.values()) works.sort((a, b) => a.key.localeCompare(b.key));

  const genreTextgroups = new Set();
  const genres = [];
  for (const [genreLabel, tgList] of Object.entries(CONFIG.GENRE_GROUPS || {})) {
    const authors = [];
    for (const tg of tgList) {
      if (!byTextgroup.has(tg)) continue; // genre may name a textgroup that isn't loaded (yet)
      genreTextgroups.add(tg);
      const works = byTextgroup.get(tg);
      authors.push({ tg, label: authorLabelForTextgroup(tg, works), works });
    }
    if (authors.length) genres.push({ label: genreLabel, authors });
  }

  const ungroupedAuthors = [];
  for (const [tg, works] of byTextgroup.entries()) {
    if (genreTextgroups.has(tg)) continue;
    ungroupedAuthors.push({ tg, label: authorLabelForTextgroup(tg, works), works });
  }
  ungroupedAuthors.sort((a, b) => a.label.localeCompare(b.label));

  return { genres, ungroupedAuthors };
}

function buildWorkFilterTree() {
  const treeEl = document.getElementById("work-filter-tree");
  treeEl.innerHTML = "";
  const { genres, ungroupedAuthors } = buildWorkGroups();

  function workRow(w) {
    const row = document.createElement("label");
    row.className = "wf-row wf-work";
    row.innerHTML = `<input type="checkbox" class="wf-cb wf-cb-work" data-key="${escapeHtml(w.key)}" checked>${escapeHtml(w.label)}`;
    return row;
  }
  function authorBlock(author) {
    const wrap = document.createElement("div");
    wrap.className = "wf-author";
    const row = document.createElement("label");
    row.className = "wf-row";
    row.innerHTML = `<input type="checkbox" class="wf-cb wf-cb-author" checked>${escapeHtml(author.label)}<span class="wf-count">(${author.works.length})</span>`;
    wrap.appendChild(row);
    author.works.forEach(w => wrap.appendChild(workRow(w)));
    return wrap;
  }
  function genreBlock(genre) {
    const wrap = document.createElement("div");
    wrap.className = "wf-genre";
    const row = document.createElement("label");
    row.className = "wf-row";
    const totalWorks = genre.authors.reduce((sum, a) => sum + a.works.length, 0);
    row.innerHTML = `<input type="checkbox" class="wf-cb wf-cb-genre" checked>${escapeHtml(genre.label)}<span class="wf-count">(${totalWorks})</span>`;
    wrap.appendChild(row);
    genre.authors.forEach(a => wrap.appendChild(authorBlock(a)));
    return wrap;
  }

  genres.forEach(g => treeEl.appendChild(genreBlock(g)));
  ungroupedAuthors.forEach(a => treeEl.appendChild(authorBlock(a)));

  updateWorkFilterSummary();
}

// Recomputes checked/indeterminate state for every Author and Genre checkbox
// from the leaf Work checkboxes underneath it. Called after ANY change so
// the tree can't drift out of sync with itself (simpler and more robust than
// separately propagating "up" on every click).
function recomputeWorkFilterTriStates() {
  const treeEl = document.getElementById("work-filter-tree");
  treeEl.querySelectorAll(".wf-author").forEach(authorDiv => {
    const authorCb = authorDiv.querySelector(":scope > .wf-row > input");
    const workCbs = Array.from(authorDiv.querySelectorAll(".wf-work input"));
    const checkedN = workCbs.filter(c => c.checked).length;
    authorCb.checked = checkedN > 0;
    authorCb.indeterminate = checkedN > 0 && checkedN < workCbs.length;
  });
  treeEl.querySelectorAll(".wf-genre").forEach(genreDiv => {
    const genreCb = genreDiv.querySelector(":scope > .wf-row > input");
    const workCbs = Array.from(genreDiv.querySelectorAll(".wf-work input"));
    const checkedN = workCbs.filter(c => c.checked).length;
    genreCb.checked = checkedN > 0;
    genreCb.indeterminate = checkedN > 0 && checkedN < workCbs.length;
  });
}

function getSelectedWorkKeys() {
  return new Set(
    Array.from(document.querySelectorAll("#work-filter-tree .wf-work input:checked"))
      .map(cb => cb.dataset.key)
  );
}

// keys: a Set of work keys to check, or null/undefined to select everything.
function setSelectedWorkKeys(keys) {
  document.querySelectorAll("#work-filter-tree .wf-work input").forEach(cb => {
    cb.checked = !keys || keys.has(cb.dataset.key);
  });
  recomputeWorkFilterTriStates();
  updateWorkFilterSummary();
}

function updateWorkFilterSummary() {
  const all = document.querySelectorAll("#work-filter-tree .wf-work input");
  const checked = document.querySelectorAll("#work-filter-tree .wf-work input:checked");
  const summary = document.getElementById("work-filter-summary");
  if (all.length === 0) {
    summary.textContent = "All works";
  } else if (checked.length === all.length) {
    summary.textContent = `All works (${all.length})`;
  } else if (checked.length === 0) {
    summary.textContent = "No works selected";
  } else if (checked.length <= 2) {
    summary.textContent = Array.from(checked)
      .map(cb => cb.closest(".wf-row").textContent.trim())
      .join(", ");
  } else {
    summary.textContent = `${checked.length} works selected`;
  }
}

// Event delegation on the tree container: a Genre/Author checkbox click
// checks/unchecks every Work checkbox beneath it; any change anywhere then
// triggers a full tri-state recompute.
document.getElementById("work-filter-tree").addEventListener("change", e => {
  const cb = e.target;
  if (!cb.classList || !cb.classList.contains("wf-cb")) return;
  if (cb.classList.contains("wf-cb-genre") || cb.classList.contains("wf-cb-author")) {
    const container = cb.closest(".wf-genre, .wf-author");
    container.querySelectorAll(".wf-work input").forEach(w => { w.checked = cb.checked; });
  }
  recomputeWorkFilterTriStates();
  updateWorkFilterSummary();
});

document.getElementById("work-filter-all").addEventListener("click", () => setSelectedWorkKeys(null));
document.getElementById("work-filter-none").addEventListener("click", () => setSelectedWorkKeys(new Set()));

// Close the dropdown when clicking outside it (native <details> otherwise
// stays open until its own summary is clicked again).
document.addEventListener("click", e => {
  const details = document.getElementById("work-filter-details");
  if (details.open && !details.contains(e.target)) details.open = false;
});

// ── URL-driven search ────────────────────────────────────────────────────
// Query params (all optional):
//   q         = search term(s), comma/semicolon-separated for a set (e.g. "λύω, λύεις")
//   mode      = either | lemma | form | gloss | translation   (default: either)
//   work      = a loaded work key (e.g. tlg0012.tlg001) to restrict to one work
//   whole     = 1 | 0   ("Whole word only", relevant for gloss/translation modes)
//   upos      = a part-of-speech value (e.g. VERB)
//   feat_KEY  = one per morphology filter (e.g. feat_Mood=Opt&feat_Person=3)
//   rawfeat   = advanced raw feats substring
//
// Example: search/?q=%CE%BB%CF%8D%CF%89&mode=lemma&feat_Mood=Opt
//
// Applied once at load (after shards + advanced panel are ready); every
// runSearch() call afterwards keeps the address bar's query string in sync
// via replaceState, so the current URL is always a shareable/bookmarkable
// link to the search actually on screen.

function applyStateFromURL() {
  const params = new URLSearchParams(window.location.search);
  if ([...params.keys()].length === 0) return false;

  document.getElementById("q").value = params.get("q") || "";

  const mode = params.get("mode") || "either";
  if (MODE_META[mode]) {
    const modeSelect = document.getElementById("mode");
    modeSelect.value = mode;
    modeSelect.dispatchEvent(new Event("change"));
  }

  // "works" (new, plural) is a comma-separated list for the checkbox tree;
  // "work" (old, singular) is kept for backward compatibility with any
  // links/bookmarks made before the tree existed, and is treated as a
  // one-work selection. Neither present -> leave the default (everything
  // selected, set when the tree was built).
  if (params.has("works")) {
    const keys = params.get("works").split(",").map(s => s.trim()).filter(Boolean);
    setSelectedWorkKeys(new Set(keys));
  } else if (params.has("work")) {
    const work = params.get("work");
    if (work) setSelectedWorkKeys(new Set([work]));
  }

  if (params.has("whole")) {
    document.getElementById("whole-word").checked = params.get("whole") === "1";
  }

  let anyFeature = false;
  if (params.has("upos")) {
    const sel = document.getElementById("feat-upos");
    if (sel) { sel.value = params.get("upos"); anyFeature = true; }
  }
  for (const def of FEATURE_DEFS) {
    if (def.isUpos) continue;
    const paramKey = `feat_${def.key}`;
    if (params.has(paramKey)) {
      const sel = document.getElementById(`feat-${def.key}`);
      if (sel) { sel.value = params.get(paramKey); anyFeature = true; }
    }
  }
  if (params.has("rawfeat")) {
    const el = document.getElementById("feat-raw");
    if (el) { el.value = params.get("rawfeat"); anyFeature = true; }
  }
  if (anyFeature) document.getElementById("advanced-panel").classList.add("open");

  return true; // something was present in the URL — go ahead and search
}

function syncURLFromForm(rawInput, mode, selectedWorks, wholeWord, upos, featClauses, rawFeat) {
  const params = new URLSearchParams();
  if (rawInput) params.set("q", rawInput);
  if (mode !== "either") params.set("mode", mode);
  // Omit "works" entirely when everything is selected (the default), so a
  // plain search keeps a short, shareable URL; only encode a real subset.
  const totalWorks = document.querySelectorAll("#work-filter-tree .wf-work input").length;
  if (selectedWorks.size !== totalWorks) params.set("works", Array.from(selectedWorks).join(","));
  if (MODE_META[mode].englishSearch) params.set("whole", wholeWord ? "1" : "0");
  if (upos) params.set("upos", upos);
  for (const [k, v] of featClauses) params.set(`feat_${k}`, v);
  if (rawFeat) params.set("rawfeat", rawFeat);

  const qs = params.toString();
  window.history.replaceState(null, "", window.location.pathname + (qs ? `?${qs}` : ""));
}

document.getElementById("search-btn").addEventListener("click", runSearch);
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });

// ── Mode metadata: label/placeholder text, whether morphology filters are
// meaningful (not for sentence-level translation search), and whether this
// is a free-text English search where "whole word only" applies. ──
const MODE_META = {
  either:      { label: "Word(s) (Greek / Latin / Arabic / Persian)", placeholder: "e.g. λύω, λύεις (comma-separated for a set)", morphology: true,  englishSearch: false },
  lemma:       { label: "Word(s) (Greek / Latin / Arabic / Persian)", placeholder: "e.g. λύω, λύεις (comma-separated for a set)", morphology: true,  englishSearch: false },
  form:        { label: "Word(s) (Greek / Latin / Arabic / Persian)", placeholder: "e.g. λύω, λύεις (comma-separated for a set)", morphology: true,  englishSearch: false },
  gloss:       { label: "English gloss(es)",  placeholder: "e.g. boldly, wisdom (comma-separated for a set)", morphology: true,  englishSearch: true },
  translation: { label: "English translation(s)", placeholder: "e.g. rosy-fingered dawn; wine-dark sea", morphology: false, englishSearch: true },
};

document.getElementById("mode").addEventListener("change", e => {
  const meta = MODE_META[e.target.value];
  document.getElementById("q-label").textContent = meta.label;
  document.getElementById("q").placeholder = meta.placeholder;
  document.getElementById("advanced-panel").querySelectorAll("select, input").forEach(el => {
    el.disabled = !meta.morphology;
  });
  document.getElementById("advanced-toggle").style.opacity = meta.morphology ? "1" : ".4";
  document.getElementById("whole-word-field").style.display = meta.englishSearch ? "flex" : "none";
});

function runSearch() {
  const rawInput = document.getElementById("q").value.trim();
  const terms = rawInput ? parseTermList(rawInput) : [];
  const mode = document.getElementById("mode").value;
  const selectedWorks = getSelectedWorkKeys();
  const morphologyApplies = MODE_META[mode].morphology;
  const upos = morphologyApplies ? ((document.getElementById("feat-upos") || {}).value || "") : "";
  const featClauses = []; // [key, value]
  if (morphologyApplies) {
    document.querySelectorAll("#advanced-panel select").forEach(sel => {
      if (sel.id === "feat-upos") return;
      if (sel.value) featClauses.push([sel.dataset.key, sel.value]);
    });
  }
  const rawFeat = morphologyApplies ? (document.getElementById("feat-raw") || {}).value.trim() : "";
  const wholeWord = MODE_META[mode].englishSearch ? document.getElementById("whole-word").checked : false;

  if (!terms.length && !upos && featClauses.length === 0 && !rawFeat) {
    alert("Enter one or more search terms (comma-separated for a set), or choose at least one morphology filter.");
    return;
  }
  if (selectedWorks.size === 0) {
    alert("Select at least one work to search (see the Works filter).");
    return;
  }

  syncURLFromForm(rawInput, mode, selectedWorks, wholeWord, upos, featClauses, rawFeat);

  const shardsToSearch = Array.from(SHARDS.entries())
    .filter(([workKey]) => selectedWorks.has(workKey));

  let matches = mode === "translation"
    ? searchTranslations(terms, shardsToSearch, wholeWord)
    : searchTokens(terms, mode, upos, featClauses, rawFeat, shardsToSearch, wholeWord);

  LAST_MATCHES = matches;
  const searchedWorkKeys = shardsToSearch.filter(([, shard]) => shard).map(([wk]) => wk);
  renderDashboard(matches, terms, searchedWorkKeys, mode);
  renderResults(matches, terms, mode, wholeWord);
}

// Word-boundary test against the RAW (unescaped) field text — used to weed
// out substring false positives like "stranger"/"angered" matching "anger".
function matchesWholeWord(text, needle) {
  if (!text || !needle) return false;
  const esc = needle.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if (!esc) return false;
  return new RegExp(`\\b${esc}\\b`, "i").test(text);
}

// ── Token-level search: lemma / form / either (accent-insensitive, exact
// match on the precomputed *_norm columns) or English gloss (substring,
// optionally narrowed to whole-word matches post-query). `terms` may hold
// one word or a whole set — a set is OR'd together in a single query. ──
function searchTokens(terms, mode, upos, featClauses, rawFeat, shardsToSearch, wholeWord) {
  const where = [];
  const params = [];
  if (terms.length) {
    if (mode === "gloss") {
      where.push("(" + terms.map(() => "gloss LIKE ?").join(" OR ") + ")");
      for (const t of terms) params.push(`%${t}%`);
    } else {
      const normed = terms.map(normKey);
      const ph = normed.map(() => "?").join(",");
      if (mode === "lemma") { where.push(`lemma_norm IN (${ph})`); params.push(...normed); }
      else if (mode === "form") { where.push(`form_norm IN (${ph})`); params.push(...normed); }
      else { where.push(`(lemma_norm IN (${ph}) OR form_norm IN (${ph}))`); params.push(...normed, ...normed); }
    }
  }
  if (upos) { where.push("upos = ?"); params.push(upos); }
  for (const [k, v] of featClauses) { where.push("feats LIKE ?"); params.push(`%${k}=${v}%`); }
  if (rawFeat) { where.push("feats LIKE ?"); params.push(`%${rawFeat}%`); }
  const whereSql = where.length ? "WHERE " + where.join(" AND ") : "";

  let matches = [];
  for (const [workKey, shard] of shardsToSearch) {
    if (!shard) continue;
    for (let partIndex = 0; partIndex < shard.dbs.length; partIndex++) {
      let rows;
      try {
        rows = queryAll(shard.dbs[partIndex], `SELECT * FROM treebank_tokens ${whereSql} ORDER BY id`, params);
      } catch (e) {
        console.error(`Query failed on ${workKey} part ${partIndex + 1} (does this shard have treebank_tokens yet?):`, e);
        continue;
      }
      if (mode === "gloss" && terms.length && wholeWord) {
        rows = rows.filter(r => terms.some(t => matchesWholeWord(r.gloss, t)));
      }
      for (const row of rows) {
        row._workKey = workKey; row._workLabel = shard.label; row._isSentenceMatch = false;
        row._partIndex = partIndex;
        row._matchedTerm = matchedTermForToken(row, mode, terms);
      }
      matches = matches.concat(rows);
    }
  }
  return matches;
}

// Which term (of a possibly multi-term search) this row actually matched —
// used for the "by search term" dashboard breakdown and CSV export.
function matchedTermForToken(row, mode, terms) {
  if (!terms.length) return null;
  if (mode === "gloss") {
    return terms.find(t => row.gloss && row.gloss.toLowerCase().includes(t.toLowerCase())) || null;
  }
  return terms.find(t => { const n = normKey(t); return n === row.lemma_norm || n === row.form_norm; }) || null;
}

// ── Sentence-level search: substring match against literal_translation or
// prose_translation. These rows have no single "hit" token (tok_id is null),
// so the KWIC view shows the whole sentence unbolded and highlights the
// matched phrase within the translation text instead. `terms` may be a set. ──
function searchTranslations(terms, shardsToSearch, wholeWord) {
  if (!terms.length) return [];
  const clause = terms.map(() => "(literal_translation LIKE ? OR prose_translation LIKE ?)").join(" OR ");
  const params = [];
  for (const t of terms) params.push(`%${t}%`, `%${t}%`);

  let matches = [];
  for (const [workKey, shard] of shardsToSearch) {
    if (!shard) continue;
    for (let partIndex = 0; partIndex < shard.dbs.length; partIndex++) {
      let rows;
      try {
        rows = queryAll(shard.dbs[partIndex],
          `SELECT id AS sentence_id, textgroup, work, version_short_id, chapter, section, subdoc,
                  literal_translation, prose_translation
           FROM treebank_sentences
           WHERE ${clause}
           ORDER BY id`,
          params);
      } catch (e) {
        console.error(`Translation query failed on ${workKey} part ${partIndex + 1}:`, e);
        continue;
      }
      if (wholeWord) {
        rows = rows.filter(r => terms.some(t => matchesWholeWord(r.literal_translation, t) || matchesWholeWord(r.prose_translation, t)));
      }
      for (const row of rows) {
        row._workKey = workKey;
        row._workLabel = shard.label;
        row._isSentenceMatch = true;
        row._partIndex = partIndex;
        row.tok_id = null; row.form = ""; row.lemma = null; row.upos = null; row.feats = null; row.gloss = null;
        row._matchedTerm = terms.find(t =>
          (row.literal_translation && row.literal_translation.toLowerCase().includes(t.toLowerCase())) ||
          (row.prose_translation && row.prose_translation.toLowerCase().includes(t.toLowerCase()))
        ) || null;
      }
      matches = matches.concat(rows);
    }
  }
  return matches;
}


// ── Dashboard: aggregate counts computed client-side over the FULL match
// set (cheap at this corpus size — thousands, not millions, of tokens). ──
function renderDashboard(matches, terms, searchedWorkKeys, mode) {
  const dash = document.getElementById("dashboard");
  const toolbar = document.getElementById("results-toolbar");
  if (matches.length === 0) {
    dash.classList.remove("open");
    toolbar.style.display = "none";
    return;
  }
  toolbar.style.display = "flex";
  document.getElementById("results-count").textContent =
    matches.length > CONFIG.RENDER_CAP
      ? `Showing ${CONFIG.RENDER_CAP} of ${matches.length} matches below — use filters or CSV export for the rest.`
      : `${matches.length} match${matches.length === 1 ? "" : "es"}.`;

  const distinctWorks = new Set(matches.map(m => m._workKey)).size;
  const byUpos = countBy(matches, m => m.upos || "—");
  const byTense = countBy(matches.filter(m => m.upos === "VERB" || m.upos === "AUX"), m => featVal(m.feats, "Tense") || "—");
  const byMoodVoice = countBy(matches.filter(m => m.upos === "VERB" || m.upos === "AUX"),
    m => `${featVal(m.feats, "Mood") || "—"} / ${featVal(m.feats, "Voice") || "—"}`);
  const distinctLemmas = new Set(matches.map(m => m.lemma).filter(Boolean));
  const byTerm = terms.length > 1 ? countBy(matches, m => m._matchedTerm || "—") : null;

  const termPhrase = terms.length === 0 ? "your filters"
    : terms.length === 1 ? `“${escapeHtml(terms[0])}”`
    : `any of ${terms.length} terms (${terms.map(escapeHtml).join(", ")})`;

  dash.innerHTML = `
    <div class="dash-summary">
      <strong>${matches.length}</strong> token${matches.length === 1 ? "" : "s"} match ${termPhrase}
      across <strong>${distinctWorks}</strong> work(s) and <strong>${distinctLemmas.size}</strong> distinct lemma(s).
    </div>
    <div class="dash-grid">
      ${byTerm ? barCard("By search term", byTerm) : ""}
      ${byWorkFreqCard(matches)}
      ${barCard("By part of speech", byUpos)}
      ${Object.keys(byTense).length ? barCard("Verb tense", byTense) : ""}
      ${Object.keys(byMoodVoice).length ? barCard("Verb mood / voice", byMoodVoice) : ""}
    </div>
    ${glossByTermTable(matches, terms, mode)}
    ${lemmaWorkTable(matches, searchedWorkKeys)}`;
  dash.classList.add("open");
  walkAndTransliterateNode(dash, GREEK_TRANSLIT_MODE);
}

// ── Lemma × work pivot: which lemmas dominate the match set, and where.
// Rows are lemmas (sorted by total count, capped so a broad/feature-only
// search doesn't render hundreds of rows); columns are the distinct works
// present, sorted the same way. Lemma cells are clickable (spawn a fresh
// lemma search), matching the KWIC table's behavior.
//
// Rates are per 1,000 tokens of the relevant work (or, for the Total
// column, per 1,000 tokens across every work actually searched — including
// ones where this particular lemma didn't occur at all, so the rate
// reflects the full searched corpus, not just the works that happened to
// match). Every rate — per-work cell and Total alike — carries its own 95%
// Wilson score CI, treating each corpus as a finite sample from a
// hypothetical much larger one of the same kind of text: it answers "how
// much would this rate plausibly move around if we had far more text of
// this kind," not literal sampling error within the fixed corpus itself.
// Works too small to support a meaningful CI are flagged rather than given
// a falsely precise-looking range.
//
// A separate "Compare two works" control runs a proper significance test
// (two-proportion z-test, or Fisher's exact test when counts are too small
// for the normal approximation) so a difference like Iliad-vs-Odyssey rates
// can be read as significant or not, not just eyeballed. ──

const MIN_TOKENS_FOR_RATE = 50; // below this a work's own token count is too small for its rate/CI to mean much
const MIN_TOTAL_FOR_SIG = 1;    // need at least one occurrence somewhere to test anything at all

// Module-level state so the "compare" dropdowns can re-render just the
// pivot table (via updatePivotCompare()) without re-running the search.
let PIVOT_STATE = { matches: null, searchedWorkKeys: null, compareA: null, compareB: null, showCounts: false };

// ── Gloss usage by search term: for a lemma/form search (one term, or a
// comma-separated set), which English gloss(es) were actually used for each
// hit, and how often. Generalizes the "just look at the KWIC rows" approach
// that works fine for a single term into something readable for a whole
// list of them at once: one row per distinct gloss seen, one column per
// searched term, so you can see at a glance both how a single term was
// rendered across the corpus and how several related terms compare.
// Not shown for gloss-mode searches (there the "term" already IS a gloss
// substring, so a term-vs-gloss table would be closer to tautological than
// informative) or for sentence/translation matches (no single gloss to
// attribute -- those don't carry gloss at all).
function glossByTermTable(matches, terms, mode, capRows = 30) {
  if (mode === "gloss" || terms.length === 0) return "";
  const withGloss = matches.filter(m => !m._isSentenceMatch && m.gloss && m._matchedTerm);
  if (withGloss.length === 0) return "";

  // term -> Map(gloss -> count), keyed in the order the person typed them
  const byTerm = new Map();
  for (const t of terms) byTerm.set(t, new Map());
  for (const m of withGloss) {
    const gmap = byTerm.get(m._matchedTerm);
    if (!gmap) continue; // shouldn't happen (matchedTermForToken only returns a term from the list), but be defensive
    gmap.set(m.gloss, (gmap.get(m.gloss) || 0) + 1);
  }

  // Rank distinct glosses by total frequency across every searched term
  // combined -- same "rank rows by total, cap the long tail" convention as
  // the lemma x work pivot below.
  const glossTotals = new Map();
  for (const gmap of byTerm.values())
    for (const [gloss, n] of gmap) glossTotals.set(gloss, (glossTotals.get(gloss) || 0) + n);

  const glossRows = Array.from(glossTotals.entries()).sort((a, b) => b[1] - a[1]);
  const truncated = glossRows.length > capRows;
  const shownRows = glossRows.slice(0, capRows);

  const colTotals = new Map();
  for (const t of terms) {
    let sum = 0;
    for (const n of byTerm.get(t).values()) sum += n;
    colTotals.set(t, sum);
  }
  const grandTotal = withGloss.length;

  const headCols = terms.map(t => `<th style="text-align:center">${escapeHtml(t)}</th>`).join("");

  const totalsRowCells = terms.map(t =>
    `<td style="text-align:center"><strong>${colTotals.get(t)}</strong></td>`
  ).join("");
  const totalsRow = `
    <tr class="totals-row">
      <td><strong>All ${glossRows.length} gloss${glossRows.length === 1 ? "" : "es"} (total)</strong></td>
      ${totalsRowCells}
      <td style="text-align:center"><strong>${grandTotal}</strong></td>
    </tr>`;

  const bodyRows = shownRows.map(([gloss, total]) => {
    const cells = terms.map(t => {
      const n = byTerm.get(t).get(gloss) || 0;
      return `<td style="text-align:center">${n || "&middot;"}</td>`;
    }).join("");
    return `
    <tr>
      <td>${glossLinkHtml(gloss)}</td>
      ${cells}
      <td style="text-align:center"><strong>${total}</strong></td>
    </tr>`;
  }).join("");

  return `
    <div class="dash-card" style="flex-basis:100%;margin-top:16px" id="gloss-term-wrap">
      <h3>Glosses by search term ${terms.length > 1 ? "— how each term was translated" : "— translation terms used"}</h3>
      <table class="lemma-work-table">
        <thead><tr>
          <th>Gloss</th>${headCols}
          <th style="text-align:center">Total</th>
        </tr></thead>
        <tbody>${totalsRow}${bodyRows}</tbody>
      </table>
      <div style="font-size:11px;color:#999;margin-top:6px">
        Counts are raw occurrences of each gloss among the matched tokens for that term (not corpus-wide rates).
        Click a gloss to spawn a fresh gloss search for it.
        ${truncated ? ` Showing top ${capRows} of ${glossRows.length} distinct glosses — the totals row above sums all ${glossRows.length}, not just the rows shown.` : ""}
      </div>
    </div>`;
}

function lemmaWorkTable(matches, searchedWorkKeys = [], capRows = 40) {
  PIVOT_STATE.matches = matches;
  PIVOT_STATE.searchedWorkKeys = searchedWorkKeys;

  const withLemma = matches.filter(m => m.lemma);
  if (withLemma.length === 0) return "";

  // Columns: every work actually searched (not just ones with a hit for
  // THIS query), so a lemma absent from a large work still gets a "0 (0.00‰)"
  // rather than a misleading blank.
  const works = (searchedWorkKeys.length ? searchedWorkKeys : [...new Set(withLemma.map(m => m._workKey))])
    .filter(wk => SHARDS.has(wk))
    .sort((a, b) => (TOTAL_TOKENS_BY_WORK.get(b) || 0) - (TOTAL_TOKENS_BY_WORK.get(a) || 0));
  const corpusTotal = works.reduce((sum, wk) => sum + (TOTAL_TOKENS_BY_WORK.get(wk) || 0), 0);

  const byLemma = new Map(); // lemma -> { total, perWork: {workKey: n} }
  for (const m of withLemma) {
    const entry = byLemma.get(m.lemma) || { total: 0, perWork: {} };
    entry.total++;
    entry.perWork[m._workKey] = (entry.perWork[m._workKey] || 0) + 1;
    byLemma.set(m.lemma, entry);
  }

  const lemmaRows = Array.from(byLemma.entries()).sort((a, b) => b[1].total - a[1].total);
  const truncated = lemmaRows.length > capRows;
  const shownRows = lemmaRows.slice(0, capRows);

  // Default / validate the two works being compared for significance.
  if (!PIVOT_STATE.compareA || !works.includes(PIVOT_STATE.compareA)) PIVOT_STATE.compareA = works[0] || null;
  if (!PIVOT_STATE.compareB || !works.includes(PIVOT_STATE.compareB) || PIVOT_STATE.compareB === PIVOT_STATE.compareA) {
    PIVOT_STATE.compareB = works.find(wk => wk !== PIVOT_STATE.compareA) || null;
  }
  const canCompare = works.length >= 2 && PIVOT_STATE.compareA && PIVOT_STATE.compareB;

  // Column totals: summed across every matched lemma, not just the capped/
  // shown rows, so this reflects the true totals for the search — same
  // principle as the existing per-lemma Total column, which is likewise
  // computed against the full corpus rather than the visible page of rows.
  const colTotals = {}; // workKey -> n
  for (const wk of works) colTotals[wk] = 0;
  let grandTotal = 0;
  for (const [, entry] of lemmaRows) {
    grandTotal += entry.total;
    for (const wk of works) colTotals[wk] += entry.perWork[wk] || 0;
  }

  const headCols = works.map(wk => `<th style="text-align:center">${escapeHtml(SHARDS.get(wk).label)}</th>`).join("");

  const totalsRowStats = works.map(wk => computeCellStat(colTotals[wk], TOTAL_TOKENS_BY_WORK.get(wk) || 0));
  const totalsRowTotalStat = computeCellStat(grandTotal, corpusTotal);
  const totalsRowScaleMax = rowScaleMax([...totalsRowStats, totalsRowTotalStat]);
  const totalsRowCellsHtml = works.map((wk, i) =>
    `<td style="text-align:center">${rateGlyphHtml(totalsRowStats[i], totalsRowScaleMax)}</td>`
  ).join("");
  const totalsRowSigHtml = canCompare
    ? significanceCellHtml(
        colTotals[PIVOT_STATE.compareA] || 0, TOTAL_TOKENS_BY_WORK.get(PIVOT_STATE.compareA) || 0,
        colTotals[PIVOT_STATE.compareB] || 0, TOTAL_TOKENS_BY_WORK.get(PIVOT_STATE.compareB) || 0
      )
    : "";
  const totalsRowHtml = `
    <tr class="totals-row">
      <td><strong>All ${lemmaRows.length} lemma${lemmaRows.length === 1 ? "" : "s"} (total)</strong></td>
      ${totalsRowCellsHtml}
      <td class="cell-total" style="text-align:center">${rateGlyphHtml(totalsRowTotalStat, totalsRowScaleMax, true)}</td>
      ${canCompare ? `<td class="sig-cell">${totalsRowSigHtml}</td>` : ""}
    </tr>`;

  const bodyRows = shownRows.map(([lemma, entry]) => {
    const perWorkStats = works.map(wk => computeCellStat(entry.perWork[wk] || 0, TOTAL_TOKENS_BY_WORK.get(wk) || 0));
    const totalStat = computeCellStat(entry.total, corpusTotal);
    const rowScale = rowScaleMax([...perWorkStats, totalStat]);
    const cellsHtml = works.map((wk, i) =>
      `<td style="text-align:center">${rateGlyphHtml(perWorkStats[i], rowScale)}</td>`
    ).join("");

    const totalCellHtml = rateGlyphHtml(totalStat, rowScale, true);

    const sigCellHtml = canCompare
      ? significanceCellHtml(
          entry.perWork[PIVOT_STATE.compareA] || 0, TOTAL_TOKENS_BY_WORK.get(PIVOT_STATE.compareA) || 0,
          entry.perWork[PIVOT_STATE.compareB] || 0, TOTAL_TOKENS_BY_WORK.get(PIVOT_STATE.compareB) || 0
        )
      : "";

    return `
    <tr>
      <td class="greek">${lemmaLinkHtml(lemma)}</td>
      ${cellsHtml}
      <td class="cell-total" style="text-align:center">${totalCellHtml}</td>
      ${canCompare ? `<td class="sig-cell">${sigCellHtml}</td>` : ""}
    </tr>`;
  }).join("");

  const compareBarHtml = works.length >= 2 ? `
    <div class="pivot-compare-bar">
      <span>Test significance of the difference between</span>
      <select id="pivot-cmp-a" onchange="updatePivotCompare()">
        ${works.map(wk => `<option value="${wk}" ${wk === PIVOT_STATE.compareA ? "selected" : ""}>${escapeHtml(SHARDS.get(wk).label)}</option>`).join("")}
      </select>
      <span>and</span>
      <select id="pivot-cmp-b" onchange="updatePivotCompare()">
        ${works.map(wk => `<option value="${wk}" ${wk === PIVOT_STATE.compareB ? "selected" : ""}>${escapeHtml(SHARDS.get(wk).label)}</option>`).join("")}
      </select>
      <span>for each lemma below.</span>
    </div>` : "";

  const countsToggleHtml = `
    <label class="pivot-counts-toggle">
      <input type="checkbox" id="pivot-show-counts" ${PIVOT_STATE.showCounts ? "checked" : ""} onchange="togglePivotCounts(this.checked)">
      Show raw counts (n)
    </label>`;

  return `
    <div class="dash-card" style="flex-basis:100%;margin-top:16px" id="lemma-pivot-wrap">
      <h3>Lemmas by work — relative frequency</h3>
      ${countsToggleHtml}
      ${compareBarHtml}
      <table class="lemma-work-table">
        <thead><tr>
          <th>Lemma</th>${headCols}
          <th style="text-align:center">Total rate /1,000 &amp; 95% CI</th>
          ${canCompare ? `<th style="text-align:center">${escapeHtml(SHARDS.get(PIVOT_STATE.compareA).label)} vs ${escapeHtml(SHARDS.get(PIVOT_STATE.compareB).label)}</th>` : ""}
        </tr></thead>
        <tbody>${totalsRowHtml}${bodyRows}</tbody>
      </table>
      <div style="font-size:11px;color:#999;margin-top:6px">
        Each cell shows the rate (occurrences per 1,000 tokens) as a dot on its own 95% Wilson-interval CI —
        the whisker span is the interval, the dot is the point estimate; the horizontal scale is fixed per
        lemma row so cells within a row are visually comparable. Per-work cells use that work's own token
        count as the base; the Total column uses the full searched corpus
        (${corpusTotal.toLocaleString()} tokens across ${works.length} work${works.length === 1 ? "" : "s"}).
        A work with fewer than ${MIN_TOKENS_FOR_RATE} tokens is flagged "insufficient data" rather than given a
        falsely precise rate. The CI is a rough guide to how much a rate might shift with a much larger sample of
        similar text — not a claim about this specific (fixed, fully-counted) corpus. Tick "Show raw counts" to
        reveal the underlying n beneath each rate.
        ${canCompare ? ` The comparison column runs a two-proportion z-test (or Fisher's exact test when counts
        are too small for that approximation) on the selected pair of works; "insufficient data" there means
        neither work has enough occurrences of that lemma to test at all.` : ""}
        ${truncated ? ` Showing top ${capRows} of ${lemmaRows.length} lemmas — the totals row above sums all ${lemmaRows.length}, not just the rows shown.` : ""}
      </div>
    </div>`;
}

// Re-render just the pivot table when the compare-works dropdowns change,
// without re-running the underlying search.
function updatePivotCompare() {
  const selA = document.getElementById("pivot-cmp-a");
  const selB = document.getElementById("pivot-cmp-b");
  if (selA) PIVOT_STATE.compareA = selA.value;
  if (selB) PIVOT_STATE.compareB = selB.value;
  rerenderPivotTable();
}

// Flip the raw-counts toggle and re-render.
function togglePivotCounts(checked) {
  PIVOT_STATE.showCounts = !!checked;
  rerenderPivotTable();
}

function rerenderPivotTable() {
  const wrap = document.getElementById("lemma-pivot-wrap");
  if (!wrap || !PIVOT_STATE.matches) return;
  const html = lemmaWorkTable(PIVOT_STATE.matches, PIVOT_STATE.searchedWorkKeys);
  wrap.outerHTML = html || wrap.outerHTML;
  walkAndTransliterateNode(document.getElementById("lemma-pivot-wrap"), GREEK_TRANSLIT_MODE);
}

// Classifies an n/denom pair into one of three states so the caller can
// decide how to render it, and (for the "ok" state) precomputes the rate
// and its 95% Wilson CI in per-1,000 terms.
//   "none"         — no denominator at all (work wasn't part of this search)
//   "insufficient" — denominator too small for a meaningful rate/CI
//   "ok"           — rate + CI are meaningful
function computeCellStat(n, denom) {
  if (!denom) return { state: "none", n, denom };
  if (denom < MIN_TOKENS_FOR_RATE) return { state: "insufficient", n, denom };
  const [lo, hi] = wilsonInterval(n, denom);
  return { state: "ok", n, denom, rate: (n / denom) * 1000, lo: lo * 1000, hi: hi * 1000 };
}

// Shared horizontal scale for a row of cell stats, so every glyph in that
// row (all works + the Total) sits on the same axis and is visually
// comparable. Based on the CI upper bounds actually being displayed, with a
// little headroom so a dot at the max isn't flush against the cell edge.
function rowScaleMax(stats) {
  const highs = stats.filter(s => s.state === "ok").map(s => s.hi);
  return highs.length ? Math.max(...highs) * 1.12 : 1;
}

// Renders a rate cell as a dot-and-whisker (forest-plot style) glyph: the
// whisker spans the 95% Wilson CI, the dot marks the point-estimate rate.
// Falls back to a text flag for missing/insufficient data. Raw n is shown
// only when the "Show raw counts" toggle is on.
function rateGlyphHtml(stat, scaleMax, alwaysShowN = false) {
  if (stat.state === "none") {
    if (alwaysShowN) return `${stat.n}`;
    return PIVOT_STATE.showCounts ? `<span class="rate-glyph-n">n=${stat.n}</span>` : "—";
  }
  if (stat.state === "insufficient") {
    return `<span class="insufficient">insufficient data (n=${stat.denom})</span>` +
      (PIVOT_STATE.showCounts ? `<span class="rate-glyph-n">n=${stat.n}</span>` : "");
  }
  const W = 84, H = 20, pad = 5;
  const clampX = v => pad + Math.max(0, Math.min(1, v / scaleMax)) * (W - 2 * pad);
  const tooltip = `${stat.rate.toFixed(2)}\u2030 (95% CI ${stat.lo.toFixed(2)}\u2013${stat.hi.toFixed(2)}\u2030)`;
  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="rate-glyph-svg" ` +
    `role="img" aria-label="rate ${tooltip}">` +
    `<title>${tooltip}</title>` +
    `<line x1="${clampX(stat.lo)}" y1="${H / 2}" x2="${clampX(stat.hi)}" y2="${H / 2}" stroke="#999" stroke-width="1.3"/>` +
    `<line x1="${clampX(stat.lo)}" y1="${H / 2 - 3.5}" x2="${clampX(stat.lo)}" y2="${H / 2 + 3.5}" stroke="#999" stroke-width="1.3"/>` +
    `<line x1="${clampX(stat.hi)}" y1="${H / 2 - 3.5}" x2="${clampX(stat.hi)}" y2="${H / 2 + 3.5}" stroke="#999" stroke-width="1.3"/>` +
    `<circle cx="${clampX(stat.rate)}" cy="${H / 2}" r="3.2" fill="var(--maroon)"/>` +
    `</svg>`;
  const rateLabel = `<span class="rate-glyph-rate">${stat.rate.toFixed(2)}\u2030</span>`;
  const nLabel = PIVOT_STATE.showCounts ? `<span class="rate-glyph-n">n=${stat.n}</span>` : "";
  return `<span class="rate-glyph-cell">${svg}${rateLabel}${nLabel}</span>`;
}

// Renders the significance-test result for one lemma between two works.
function significanceCellHtml(x1, n1, x2, n2) {
  if (!n1 || !n2) return `<span class="insufficient">n/a</span>`;
  if (x1 + x2 < MIN_TOTAL_FOR_SIG) return `<span class="insufficient">no occurrences</span>`;
  const { p, method } = compareTwoProportions(x1, n1, x2, n2);
  const stars = significanceStars(p);
  const cls = p < 0.05 ? "sig-yes" : "sig-no";
  return `<span class="sig-stars ${cls}">${stars}</span>` +
    `<span class="sig-p">p=${p < 0.001 ? "<0.001" : p.toFixed(3)}</span>` +
    `<span class="sig-method">${method === "fisher" ? "Fisher's exact" : "z-test"}</span>`;
}

function significanceStars(p) {
  if (p < 0.001) return "***";
  if (p < 0.01) return "**";
  if (p < 0.05) return "*";
  return "ns";
}

// Picks a two-proportion z-test when the normal approximation is valid
// (both expected cell counts under the pooled proportion are >= 5), and
// falls back to Fisher's exact test otherwise — which is exactly the case
// where counts are too sparse for "insufficient data" per-cell CIs anyway.
function compareTwoProportions(x1, n1, x2, n2) {
  const pooled = (x1 + x2) / (n1 + n2);
  const normalOk =
    n1 * pooled >= 5 && n1 * (1 - pooled) >= 5 &&
    n2 * pooled >= 5 && n2 * (1 - pooled) >= 5;
  if (normalOk) {
    const p1 = x1 / n1, p2 = x2 / n2;
    const se = Math.sqrt(pooled * (1 - pooled) * (1 / n1 + 1 / n2));
    const z = se === 0 ? 0 : (p1 - p2) / se;
    const p = se === 0 ? 1 : 2 * (1 - normalCDF(Math.abs(z)));
    return { p: Math.min(1, Math.max(0, p)), method: "z" };
  }
  return { p: fisherExact2x2(x1, n1 - x1, x2, n2 - x2), method: "fisher" };
}

// Standard normal CDF via the Abramowitz-Stegun erf approximation
// (max error ~1.5e-7 — plenty for p-value bucketing/star display).
function erf(x) {
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, pc = 0.3275911;
  const t = 1 / (1 + pc * x);
  const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return sign * y;
}
function normalCDF(z) { return 0.5 * (1 + erf(z / Math.SQRT2)); }

// log(nCk), summed directly rather than via lgamma of huge n, since k is
// always small here (bounded by total occurrence count) even though n can
// be a whole corpus's token count — this keeps it both fast and numerically
// stable (no subtracting two enormous near-equal log-factorials).
function logChoose(n, k) {
  if (k < 0 || k > n) return -Infinity;
  k = Math.min(k, n - k);
  let result = 0;
  for (let i = 0; i < k; i++) result += Math.log(n - i) - Math.log(i + 1);
  return result;
}

// Fisher's exact test (two-sided) for a 2x2 table
//   [[a, b], [c, d]]   a=x1 successes of n1=a+b,  c=x2 successes of n2=c+d
// Enumerated over all tables sharing the same margins; since the margins
// here are (corpus size, corpus size) x (total occurrences, total non-
// occurrences), the enumeration range is bounded by the small "total
// occurrences" margin even when corpora are huge, so this stays cheap.
function fisherExact2x2(a, b, c, d) {
  const row1 = a + b, row2 = c + d, col1 = a + c, N = row1 + row2;
  const aMin = Math.max(0, col1 - row2), aMax = Math.min(row1, col1);
  const logProbs = [];
  for (let k = aMin; k <= aMax; k++) {
    logProbs.push(logChoose(row1, k) + logChoose(row2, col1 - k) - logChoose(N, col1));
  }
  const maxLog = Math.max(...logProbs);
  const weights = logProbs.map(lp => Math.exp(lp - maxLog));
  const totalWeight = weights.reduce((s, w) => s + w, 0);
  const observedLog = logChoose(row1, a) + logChoose(row2, col1 - a) - logChoose(N, col1);
  const epsilon = 1e-7;
  let qualifyingWeight = 0;
  for (let i = 0; i < logProbs.length; i++) {
    if (logProbs[i] <= observedLog + epsilon) qualifyingWeight += weights[i];
  }
  return Math.min(1, qualifyingWeight / totalWeight);
}

// Wilson score interval for a binomial proportion x/n at confidence z
// (default z=1.96 -> 95%). Returns [lower, upper] as proportions in [0,1].
function wilsonInterval(x, n, z = 1.96) {
  if (!n) return [0, 0];
  const phat = x / n;
  const z2 = z * z;
  const denom = 1 + z2 / n;
  const center = phat + z2 / (2 * n);
  const margin = z * Math.sqrt((phat * (1 - phat)) / n + z2 / (4 * n * n));
  return [Math.max(0, (center - margin) / denom), Math.min(1, (center + margin) / denom)];
}

function countBy(arr, fn) {
  const m = {};
  for (const x of arr) { const k = fn(x); m[k] = (m[k] || 0) + 1; }
  return m;
}
function featVal(feats, key) {
  if (!feats) return null;
  for (const kv of feats.split("|")) {
    const [k, v] = kv.split("=");
    if (k === key) return v;
  }
  return null;
}
// Module-level state so the "show absolute counts" toggle on the by-work
// card can re-render just that card without re-running the search — same
// pattern as PIVOT_STATE for the lemma x work pivot below.
let BYWORK_STATE = { matches: null, showAbsolute: false };

// ── By-work summary card: leads with relative frequency (rate per 1,000
// tokens of that work, with a 95% Wilson CI whisker) rather than raw match
// counts, because raw counts are dominated by work length -- a short work
// like Suppliant Women can have a far higher rate of a given lemma than a
// long work like the Iliad while showing fewer total hits. An "absolute
// counts" toggle is available for people who want the raw numbers instead. ──
function byWorkFreqCard(matches) {
  BYWORK_STATE.matches = matches;
  const counts = countBy(matches, m => m._workKey);
  const rows = Object.entries(counts).map(([wk, n]) => ({
    wk, n,
    label: SHARDS.has(wk) ? SHARDS.get(wk).label : wk,
    stat: computeCellStat(n, TOTAL_TOKENS_BY_WORK.get(wk) || 0)
  }));

  const toggleHtml = `
    <label class="freq-toggle">
      <input type="checkbox" id="bywork-show-absolute" ${BYWORK_STATE.showAbsolute ? "checked" : ""}
        onchange="toggleByWorkAbsolute(this.checked)">
      Show absolute counts
    </label>`;

  let bodyHtml, noteHtml;
  if (BYWORK_STATE.showAbsolute) {
    const sorted = rows.slice().sort((a, b) => b.n - a.n);
    const max = Math.max(...sorted.map(r => r.n), 1);
    bodyHtml = sorted.map(r => `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(r.n / max * 100).toFixed(0)}%"></div></div>
        <div class="bar-count">${r.n}</div>
      </div>`).join("");
    noteHtml = "";
  } else {
    const scaleMax = rowScaleMax(rows.map(r => r.stat));
    const sorted = rows.slice().sort((a, b) => {
      const ra = a.stat.state === "ok" ? a.stat.rate : -1;
      const rb = b.stat.state === "ok" ? b.stat.rate : -1;
      return rb - ra;
    });
    bodyHtml = sorted.map(r => `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</div>
        <div class="bar-track">${whiskerBarHtml(r.stat, scaleMax)}</div>
        <div class="bar-count wide">${r.stat.state === "ok" ? r.stat.rate.toFixed(2) + "\u2030" : "n/a"}</div>
      </div>`).join("");
    noteHtml = `<div class="card-note">Rate per 1,000 tokens of that work; whisker = 95% Wilson CI.</div>`;
  }

  return `
    <div class="dash-card" id="bywork-card">
      <h3>By work — relative frequency</h3>
      ${toggleHtml}
      ${bodyHtml}
      ${noteHtml}
    </div>`;
}

// Re-render just the by-work card when its toggle changes.
function toggleByWorkAbsolute(checked) {
  BYWORK_STATE.showAbsolute = !!checked;
  const card = document.getElementById("bywork-card");
  if (!card || !BYWORK_STATE.matches) return;
  card.outerHTML = byWorkFreqCard(BYWORK_STATE.matches);
}

// Dot-and-whisker: the whisker spans the 95% Wilson CI, the dot marks the
// point-estimate rate. No filled bar -- a bar filled from zero to the rate
// implies "from zero" is a meaningful baseline, which isn't the claim being
// made here, and the fill visually competes with the whisker it's supposed
// to support. Same idea as the pivot table's per-cell glyph, stretched to
// full card width.
function whiskerBarHtml(stat, scaleMax) {
  if (stat.state !== "ok") return `<span class="na-flag">insufficient data (n=${stat.denom})</span>`;
  const pct = v => Math.max(0, Math.min(100, (v / scaleMax) * 100));
  const tooltip = `${stat.rate.toFixed(2)}\u2030 (95% CI ${stat.lo.toFixed(2)}\u2013${stat.hi.toFixed(2)}\u2030)`;
  return `<svg class="whisker-svg" width="100%" height="12" viewBox="0 0 100 12" preserveAspectRatio="none" ` +
    `role="img" aria-label="rate ${tooltip}">` +
    `<title>${tooltip}</title>` +
    `<line x1="${pct(stat.lo)}" y1="6" x2="${pct(stat.hi)}" y2="6" stroke="#999" stroke-width="1"/>` +
    `<line x1="${pct(stat.lo)}" y1="3" x2="${pct(stat.lo)}" y2="9" stroke="#999" stroke-width="1"/>` +
    `<line x1="${pct(stat.hi)}" y1="3" x2="${pct(stat.hi)}" y2="9" stroke="#999" stroke-width="1"/>` +
    `<line x1="${pct(stat.rate)}" y1="2" x2="${pct(stat.rate)}" y2="10" stroke="var(--maroon)" stroke-width="2"/>` +
    `</svg>`;
}

function barCard(title, counts) {
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const max = Math.max(...entries.map(e => e[1]), 1);
  return `<div class="dash-card"><h3>${title}</h3>` +
    entries.map(([label, n]) => `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(n / max * 100).toFixed(0)}%"></div></div>
        <div class="bar-count">${n}</div>
      </div>`).join("") + `</div>`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
// A KWIC row's "Location" column shows the coarse passage-chunk range
// (e.g. "39-83") that the sentence was binned into for display purposes.
// Within that chunk, every token still carries its own exact line number
// in `ref` (the same per-line CTS reference used for deep-linking) -- this
// groups tokens back into their individual lines so readers see real verse
// line breaks and numbers, not one run-on block for the whole chunk.
// A token's transliteration is expected to arrive as a `translit` field on
// the parsed sentence_json token object (mirroring the UD MISC "Translit="
// convention), but ingestion pipelines vary in exactly where they put it --
// this checks the couple of likely spots so the UI lights up automatically
// once the data exists, without needing a matching front-end change. Lemma
// transliteration isn't ingested yet (per-form only, for now), so this
// intentionally only ever looks at the token/word level.
function getTranslit(t) {
  if (!t) return null;
  return t.translit || t.transliteration || t.Translit
    || featVal(t.feats, "Translit") || featVal(t.misc, "Translit")
    || null;
}

// Same idea, one level up: a sentence-wide transliteration field, if the
// ingestion recorded one directly. Falls back to stitching per-token
// transliterations together (skipping the space before punctuation, same
// convention as buildLineBrokenContext) when no direct field is present but
// the tokens themselves carry translit -- so this degrades gracefully
// either way the data ends up shaped.
function getSentenceTranslit(sent, toks) {
  if (!sent) return null;
  const direct = sent.translit || sent.transliteration || sent.sentence_translit;
  if (direct) return direct;
  if (toks && toks.some(t => getTranslit(t))) {
    return toks.map(t => {
      const tr = getTranslit(t) || t.form;
      return (t.upos === "PUNCT" ? "" : " ") + tr;
    }).join("").trim();
  }
  return null;
}

// ── Citation string ("book.line-range" etc.) ────────────────────────────
// A row's subdoc/chapter/section columns are copied straight from
// treebank_sentences (token-match rows get them duplicated onto every
// token by Cell 1b's flatten step; sentence/translation-match rows read
// them directly) -- same meaning either way, so this needs no match-type
// branching. What they actually hold, per the ingest notebook:
//   - subdoc:  the sentence's own first-token citation ref. For a
//     multi-book work this is "book.line" (e.g. "17.485"); for a
//     single-book work it's a bare line ("134"); for prose without card
//     intervals it's the full "chapter.section" locus already ("1.5").
//   - chapter: for poetry with card intervals, the resolved CARD'S OWN
//     RANGE label (e.g. "462-504" or "109-139") -- courser and far more
//     useful for a citation than subdoc's single starting line. For prose
//     (no card intervals) it's just subdoc's own leading segment again,
//     so showing it would duplicate subdoc rather than add anything.
//   - section: an internal per-shard sentence counter for card-based
//     poetry (meaningless as a citation), or a real chapter subsection for
//     prose (already folded into subdoc) -- never worth displaying here.
// So: when chapter looks like a card range ("has a dash"), show it
// together with whatever book prefix subdoc carries ("17.462-504"); on a
// single-book work there's no book prefix to add, so the range stands
// alone ("109-139"). Otherwise (prose, or no card lookup at all) subdoc
// already fully specifies the locus by itself.
function buildCitation(row) {
  if (row.subdoc) {
    const isCardRange = row.chapter && row.chapter.includes("-");
    if (isCardRange) {
      const dotIdx = row.subdoc.indexOf(".");
      const bookPart = dotIdx === -1 ? null : row.subdoc.slice(0, dotIdx);
      return bookPart ? `${bookPart}.${row.chapter}` : row.chapter;
    }
    return row.subdoc;
  }
  const parts = [];
  if (row.chapter) parts.push(row.chapter);
  if (row.section && row.section !== "1") parts.push(row.section);
  return parts.join(".");
}

function buildLineBrokenContext(toks, hitTokId) {
  const lines = [];
  let currentRef = Symbol(); // sentinel guarantees the first token starts a new line
  let currentTokens = null;
  for (const t of toks) {
    const ref = t.ref || "";
    if (ref !== currentRef) {
      currentRef = ref;
      currentTokens = [];
      lines.push({ ref, tokens: currentTokens });
    }
    currentTokens.push(t);
  }

  return lines.map(line => {
    const lineHtml = line.tokens.map(t => {
      const isHit = t.id === hitTokId;
      const formHtml = isHit ? `<span class="hit">${escapeHtml(t.form)}</span>` : escapeHtml(t.form);
      const translit = getTranslit(t);
      const noSpaceBefore = t.upos === "PUNCT";
      const piece = translit
        ? `<span class="word-stack"><span class="form">${formHtml}</span><span class="translit">${escapeHtml(translit)}</span></span>`
        : formHtml;
      return (noSpaceBefore ? "" : " ") + piece;
    }).join("").trim();
    const lineLabel = line.ref ? `<span class="line-num">${escapeHtml(line.ref)}</span>` : "";
    return `<div class="verse-line">${lineLabel}${lineHtml}</div>`;
  }).join("");
}

function highlightSubstring(text, needles, wholeWord) {
  const escaped = escapeHtml(text);
  const list = (Array.isArray(needles) ? needles : [needles]).filter(Boolean);
  if (list.length === 0) return escaped;
  const escList = list
    .map(n => escapeHtml(n).trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .filter(Boolean);
  if (escList.length === 0) return escaped;
  const alt = escList.length === 1 ? escList[0] : `(?:${escList.join("|")})`;
  const pattern = wholeWord ? `\\b${alt}\\b` : alt;
  return escaped.replace(new RegExp(pattern, "ig"), m => `<mark>${m}</mark>`);
}

// ── Clickable lemma/gloss: let a reader spawn a fresh search straight from
// a result row (or from the expanded full-treebank panel) instead of
// retyping the term. data-term round-trips safely through the HTML
// attribute (browser decodes the entities back to the raw string). ──
function lemmaLinkHtml(lemma) {
  if (!lemma) return "—";
  return `<a href="#" class="xlink" data-term="${escapeHtml(lemma)}" data-mode="lemma" onclick="return spawnSearchFromEl(this)">${escapeHtml(lemma)}</a>`;
}
function glossLinkHtml(gloss, displayHtml) {
  if (!gloss) return "";
  const inner = displayHtml != null ? displayHtml : escapeHtml(gloss);
  return `<a href="#" class="xlink" data-term="${escapeHtml(gloss)}" data-mode="gloss" onclick="return spawnSearchFromEl(this)">${inner}</a>`;
}
function spawnSearchFromEl(el) {
  const term = el.dataset.term;
  const mode = el.dataset.mode;
  document.getElementById("q").value = term;
  const modeSelect = document.getElementById("mode");
  modeSelect.value = mode;
  modeSelect.dispatchEvent(new Event("change")); // updates label/placeholder/disabled state
  runSearch();
  window.scrollTo({ top: 0, behavior: "smooth" });
  return false;
}


// ── KWIC results: reconstruct sentence context by re-fetching the parent
// sentence rows (batched per shard) so the matched token can be shown
// in-line, bolded, alongside its gloss and the sentence's literal/prose
// translation where one was recorded. ──
// Tokens for each rendered row's sentence, keyed by row index, so the
// expandable "full treebank" panel needs no extra DB queries — it's built
// straight from the sentence_json already fetched for the context line.
let ROW_TOKENS = [];

function renderResults(matches, terms, mode, wholeWord) {
  const container = document.getElementById("results");
  ROW_TOKENS = [];
  if (matches.length === 0) {
    container.innerHTML = `<div id="empty-note">No matches. Try removing accents, switching “Match against” to Lemma, or loosening morphology/mode.</div>`;
    return;
  }
  const shown = matches.slice(0, CONFIG.RENDER_CAP);

  // Group by (work, part) so each row's sentence context is fetched from
  // the exact part db it actually came from, in one batched query per part.
  const byShardPart = {};
  for (const row of shown) {
    const key = `${row._workKey}:::${row._partIndex}`;
    (byShardPart[key] = byShardPart[key] || []).push(row);
  }

  const sentenceCache = new Map(); // `${workKey}:${sentence_id}` -> {sentence_json, prose, literal}
  for (const [key, rows] of Object.entries(byShardPart)) {
    const [workKey, partIndexStr] = key.split(":::");
    const shard = SHARDS.get(workKey);
    if (!shard) continue;
    const db = shard.dbs[Number(partIndexStr)];
    if (!db) continue;
    const ids = [...new Set(rows.map(r => r.sentence_id))];
    if (ids.length === 0) continue;
    const placeholders = ids.map(() => "?").join(",");
    const sentRows = queryAll(db,
      `SELECT * FROM treebank_sentences WHERE id IN (${placeholders})`,
      ids);
    for (const sr of sentRows) sentenceCache.set(`${workKey}:${sr.id}`, sr);
  }

  const bodyRows = shown.map((row, i) => {
    const key = `${row._workKey}:${row.sentence_id}`;
    const sent = sentenceCache.get(key);
    let contextHtml = row.form ? `<span class="hit">${escapeHtml(row.form)}</span>` : "";
    let toks = null;
    let literal = "", prose = "";
    if (sent) {
      if (sent.sentence_json) {
        try {
          toks = JSON.parse(sent.sentence_json);
          contextHtml = buildLineBrokenContext(toks, row.tok_id);
        } catch (e) { /* leave fallback contextHtml */ }
      }
      literal = sent.literal_translation || "";
      prose = sent.prose_translation || "";
    }
    ROW_TOKENS[i] = { tokens: toks, hitTokId: row.tok_id };

    const sentTranslit = getSentenceTranslit(sent, toks);
    const literalHtml = literal ? (mode === "translation" ? highlightSubstring(literal, terms, wholeWord) : escapeHtml(literal)) : "";
    const proseHtml = prose ? (mode === "translation" ? highlightSubstring(prose, terms, wholeWord) : escapeHtml(prose)) : "";
    const translationHtml = (literal || prose || sentTranslit) ? `
      <div class="translation-block">
        ${sentTranslit ? `<div class="translit-line"><span class="lbl">Transliteration</span>${escapeHtml(sentTranslit)}</div>` : ""}
        ${literal ? `<div class="lit"><span class="lbl">Literal</span>${literalHtml}</div>` : ""}
        ${prose ? `<div class="prose"><span class="lbl">Translation</span>${proseHtml}</div>` : ""}
      </div>` : "";
    const matchTag = row._isSentenceMatch
      ? `<span style="font-size:11px;color:#999;font-style:italic"> — matched via translation</span>` : "";

    const glossHtml = row.gloss ? (mode === "gloss" ? highlightSubstring(row.gloss, terms, wholeWord) : escapeHtml(row.gloss)) : "";

    return `
      <tr id="row-${i}">
        <td class="work-tag">${escapeHtml(row._workLabel)}<br>${escapeHtml(buildCitation(row))}</td>
        <td class="greek">
          ${contextHtml}${matchTag}
          ${translationHtml}
          ${toks ? `<button class="tb-toggle" onclick="toggleDetail(${i})">▸ Full treebank</button>` : ""}
        </td>
        <td>${lemmaLinkHtml(row.lemma)}<br><span class="feats">${escapeHtml(row.upos || "")}${row.feats ? " · " + escapeHtml(row.feats) : ""}</span></td>
        <td class="gloss">${glossLinkHtml(row.gloss, glossHtml)}</td>
        <td class="read-link"><a href="${buildReaderLink(row)}" target="_blank" rel="noopener">Read in context →</a></td>
      </tr>
      <tr class="detail-row" id="detail-${i}" style="display:none"><td colspan="5"></td></tr>`;
  }).join("");

  container.innerHTML = `
    <table id="kwic">
      <thead><tr><th>Location</th><th>Context &amp; translation</th><th>Lemma / morphology</th><th>Gloss</th><th></th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>`;
  walkAndTransliterateNode(container, GREEK_TRANSLIT_MODE);
}

// Expand/collapse the full per-token treebank annotation for one matched
// sentence in place, so a reader can interrogate every word (lemma, POS,
// morphology, gloss, dependency head) without leaving the search results.
function toggleDetail(i) {
  const detailRow = document.getElementById(`detail-${i}`);
  const btn = document.querySelector(`#row-${i} .tb-toggle`);
  const isOpen = detailRow.style.display !== "none";
  if (isOpen) {
    detailRow.style.display = "none";
    if (btn) btn.textContent = "▸ Full treebank";
    return;
  }
  const { tokens, hitTokId } = ROW_TOKENS[i] || {};
  if (tokens && detailRow.querySelector("td").innerHTML.trim() === "") {
    const anyTranslit = tokens.some(t => getTranslit(t));
    const rows = tokens.map(t => `
      <tr class="${t.id === hitTokId ? "hit-token" : ""}">
        <td>${t.id}</td>
        <td class="g">${escapeHtml(t.form)}</td>
        ${anyTranslit ? `<td class="translit-cell">${escapeHtml(getTranslit(t) || "")}</td>` : ""}
        <td>${t.lemma ? lemmaLinkHtml(t.lemma) : ""}</td>
        <td>${escapeHtml(t.upos || "")}</td>
        <td class="feats-cell">${escapeHtml(t.feats || "")}</td>
        <td>${escapeHtml(t.deprel || "")}</td>
        <td>${t.head != null ? t.head : ""}</td>
        <td>${t.gloss ? glossLinkHtml(t.gloss) : ""}</td>
      </tr>`).join("");
    detailRow.querySelector("td").innerHTML = `
      <table class="tb-detail">
        <thead><tr><th>#</th><th>Form</th>${anyTranslit ? "<th>Translit</th>" : ""}<th>Lemma</th><th>UPOS</th><th>Feats</th><th>Deprel</th><th>Head</th><th>Gloss</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${anyTranslit ? `<div style="font-size:10px;color:#aaa;margin-top:4px">Lemma transliteration isn't ingested yet — only word forms are transliterated so far.</div>` : ""}`;
    walkAndTransliterateNode(detailRow, GREEK_TRANSLIT_MODE);
  }
  detailRow.style.display = "table-row";
  if (btn) btn.textContent = "▾ Full treebank";
}

// NOTE: this is the one spot most likely to need hand-tuning per work — it
// mirrors the existing reader's own updateURLState()/initializeRoutingFromURL()
// URL scheme (?w=<textgroup>.<work>:<subdoc>[.<chapter>][.<section>]&focus=<version>).
// If a given work's citation isn't book-qualified the way the reader
// expects, adjust buildCitation() (used here and in the results table).
function buildReaderLink(row) {
  const passage = buildCitation(row);
  const params = new URLSearchParams();
  params.set("w", `${row._workKey}:${passage}`);
  params.set("focus", row.version_short_id);
  return `${CONFIG.READER_URL}?${params.toString()}`;
}

function downloadCsv() {
  if (LAST_MATCHES.length === 0) return;
  const cols = ["_matchedTerm","_workLabel","chapter","section","form","lemma","upos","feats","gloss","ref","version_short_id"];
  const lines = [cols.join(",")];
  for (const row of LAST_MATCHES) {
    lines.push(cols.map(c => csvCell(row[c])).join(","));
  }
  const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "treebank_search_results.csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function csvCell(v) {
  if (v == null) return "";
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
</script>
