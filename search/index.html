<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Treebank Search | Perseus Workspace Engine</title>
<style>
  :root {
    --maroon: #660000;
    --maroon-dark: #440000;
    --paper: #f5f0e8;
    --line: #d0c8b8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, serif;
    margin: 0;
    background: #fff;
    color: #222;
  }
  header {
    background: var(--maroon);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: bold; }
  header a { color: #f5d9d9; font-size: 12px; }
  #status-bar {
    font-size: 12px; color: #555; font-style: italic;
    background: var(--paper); border-bottom: 1px solid var(--line);
    padding: 6px 20px;
  }
  #controls {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; font-size: 11px; color: #555; }
  .field label { margin-bottom: 3px; font-weight: bold; }
  .field input[type=text] {
    font-family: 'Times New Roman', serif;
    font-size: 16px;
    padding: 6px 8px;
    border: 1px solid #bbb;
    border-radius: 3px;
    min-width: 220px;
  }
  .field select {
    font-size: 12px; padding: 4px 6px; border: 1px solid #bbb; border-radius: 3px; background: #fff;
  }
  #search-btn {
    background: var(--maroon); color: #fff; border: none; border-radius: 4px;
    padding: 9px 22px; font-family: Georgia, serif; font-weight: bold; font-size: 14px;
    cursor: pointer; height: 34px;
  }
  #search-btn:hover { background: var(--maroon-dark); }
  #advanced-toggle { font-size: 11px; color: var(--maroon); cursor: pointer; text-decoration: underline; align-self: center; }
  #advanced-panel { display: none; width: 100%; gap: 10px 16px; flex-wrap: wrap; padding-top: 8px; border-top: 1px dashed var(--line); margin-top: 6px; }
  #advanced-panel.open { display: flex; }

  main { padding: 18px 20px 60px; max-width: 1100px; margin: 0 auto; }

  #dashboard { display: none; margin-bottom: 24px; }
  #dashboard.open { display: block; }
  .dash-summary {
    font-size: 15px; margin-bottom: 12px; padding: 10px 14px;
    background: #fbf7ef; border-left: 4px solid var(--maroon); border-radius: 2px;
  }
  .dash-grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .dash-card {
    flex: 1 1 220px; border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px;
    background: #fff;
  }
  .dash-card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #777; margin: 0 0 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; }
  .bar-label { flex: 0 0 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: #eee; border-radius: 2px; height: 12px; overflow: hidden; }
  .bar-fill { background: var(--maroon); height: 100%; }
  .bar-count { flex: 0 0 34px; text-align: right; font-size: 12px; color: #555; }
  .bar-count.wide { flex-basis: 52px; }
  .bar-track .whisker-svg { display: block; }
  .dash-card .freq-toggle {
    display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888; margin: -4px 0 8px;
  }
  .dash-card .card-note { font-size: 10px; color: #aaa; margin-top: 6px; }
  .dash-card .na-flag { font-size: 11px; color: #b5651d; font-style: italic; line-height: 12px; display: block; }

  #results-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #results-toolbar span { font-size: 12px; color: #666; }
  #csv-btn {
    font-size: 12px; background: #fff; border: 1px solid var(--maroon); color: var(--maroon);
    border-radius: 3px; padding: 4px 10px; cursor: pointer;
  }
  #csv-btn:hover { background: #fbeaea; }

  table#kwic { border-collapse: collapse; width: 100%; font-size: 14px; }
  table#kwic th {
    text-align: left; font-size: 11px; color: #777; text-transform: uppercase;
    border-bottom: 2px solid var(--line); padding: 6px 8px;
  }
  table#kwic td { border-bottom: 1px solid #eee; padding: 8px; vertical-align: top; }
  .greek { font-family: 'Gentium Plus', 'Times New Roman', serif; font-size: 17px; }
  .greek .hit { font-weight: bold; color: var(--maroon); text-decoration: underline; }
  .verse-line { display: block; }
  .line-num {
    display: inline-block; min-width: 2.4em; margin-right: 8px;
    font-family: Georgia, serif; font-size: 11px; color: #aaa; text-align: right;
    vertical-align: baseline; user-select: none;
  }
  .gloss { color: #555; font-style: italic; font-size: 13px; }
  .feats { font-family: monospace; font-size: 11px; color: #888; }
  .work-tag { font-size: 11px; color: #666; }
  .read-link { font-size: 12px; }
  #empty-note, #load-note { color: #777; font-size: 13px; padding: 20px 0; }

  /* Interlinear per-word transliteration under the original-script form
     (used for Persian/Arabic tokens with a translit value; harmless no-op
     for tokens without one). Kept as its own inline-block per word so the
     Latin line stays aligned under its word even when the line itself is
     RTL script running LTR word-order on the page. */
  .word-stack { display: inline-block; text-align: center; vertical-align: top; margin: 0 1px; }
  .word-stack .form { display: block; }
  .word-stack .translit {
    display: block; direction: ltr; unicode-bidi: isolate;
    font-family: Georgia, serif; font-size: 11px; color: #999; font-style: italic;
  }
  .translation-block .translit-line {
    display: block; direction: ltr; unicode-bidi: isolate;
    color: #999; font-style: italic; font-size: 13px;
  }

  .translation-block { margin-top: 4px; }
  .translation-block .lit { color: #444; }
  .translation-block .prose { color: #999; }
  .translation-block .lbl { font-weight: bold; font-style: normal; color: #999; font-size: 11px; text-transform: uppercase; margin-right: 4px; }
  .tb-toggle {
    font-size: 11px; color: var(--maroon); cursor: pointer; text-decoration: underline;
    background: none; border: none; padding: 0; margin-top: 6px; display: inline-block; font-family: Georgia, serif;
  }
  tr.detail-row td { background: #fbf8f3; padding: 10px 8px 14px; }
  table.tb-detail { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.tb-detail th {
    text-align: left; font-size: 10px; color: #999; text-transform: uppercase;
    border-bottom: 1px solid var(--line); padding: 3px 6px;
  }
  table.tb-detail td { padding: 3px 6px; border-bottom: 1px solid #eee; }
  table.tb-detail td.g { font-family: 'Gentium Plus', 'Times New Roman', serif; font-size: 15px; }
  table.tb-detail tr.hit-token td { background: #f5e5e5; }
  table.tb-detail td.feats-cell { font-family: monospace; font-size: 10px; color: #888; }
  table.tb-detail td.translit-cell { direction: ltr; unicode-bidi: isolate; font-style: italic; color: #888; }

  mark { background: #ffe9a8; padding: 0 1px; border-radius: 2px; }
  #advanced-panel select:disabled, #advanced-panel input:disabled { opacity: .4; cursor: not-allowed; }

  a.xlink {
    color: var(--maroon); text-decoration: none; border-bottom: 1px dotted var(--maroon);
    cursor: pointer;
  }
  a.xlink:hover { background: #fbeaea; }

  table.lemma-work-table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 4px; }
  table.lemma-work-table th {
    text-align: left; font-size: 10px; color: #999; text-transform: uppercase;
    border-bottom: 1px solid var(--line); padding: 4px 8px;
  }
  table.lemma-work-table td { padding: 4px 8px; border-bottom: 1px solid #eee; }
  table.lemma-work-table tr:hover td { background: #fbf8f3; }
  table.lemma-work-table tr.totals-row td {
    background: #f3ece0; border-bottom: 2px solid #cbb98a; border-top: none; font-weight: 600;
  }
  table.lemma-work-table tr.totals-row:hover td { background: #eee2cd; }
  table.lemma-work-table .rate-glyph-cell { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.2; }
  table.lemma-work-table .rate-glyph-svg { display: block; }
  table.lemma-work-table .rate-glyph-rate { font-size: 11px; color: #444; font-family: monospace; }
  table.lemma-work-table .cell-total .rate-glyph-rate { font-size: 12px; font-weight: 600; color: #222; }
  table.lemma-work-table .rate-glyph-n { font-size: 9px; color: #999; font-family: monospace; }
  table.lemma-work-table .insufficient { font-size: 10px; color: #b5651d; font-style: italic; display: block; }
  .pivot-counts-toggle {
    display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; margin: 6px 0;
  }
  table.lemma-work-table .sig-cell { text-align: center; }
  table.lemma-work-table .sig-stars { font-weight: bold; }
  table.lemma-work-table .sig-stars.sig-yes { color: var(--maroon); }
  table.lemma-work-table .sig-stars.sig-no { color: #999; font-weight: normal; }
  table.lemma-work-table .sig-p { display: block; font-size: 10px; color: #999; font-family: monospace; }
  table.lemma-work-table .sig-method { font-size: 9px; color: #aaa; }
  .pivot-compare-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    font-size: 12px; color: #555; margin: 10px 0 6px; padding: 8px 10px;
    background: #fbf7ef; border: 1px solid var(--line); border-radius: 3px;
  }
  .pivot-compare-bar select {
    font-size: 12px; padding: 2px 4px; border: 1px solid #bbb; border-radius: 3px; background: #fff;
  }
  .pivot-compare-bar strong { color: var(--maroon); }

  /* ── Hierarchical work-filter checkbox tree ─────────────────────────── */
  #work-filter-details { position: relative; }
  #work-filter-details summary {
    list-style: none; cursor: pointer; user-select: none;
    font-size: 12px; padding: 5px 8px; border: 1px solid #bbb; border-radius: 3px;
    background: #fff; min-width: 170px; max-width: 260px; height: 22px;
    display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #work-filter-details summary::-webkit-details-marker { display: none; }
  #work-filter-details summary::after { content: "▾"; margin-left: auto; padding-left: 6px; color: #999; font-size: 10px; }
  #work-filter-details[open] summary::after { content: "▴"; }
  #work-filter-panel {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
    background: #fff; border: 1px solid #bbb; border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
    width: 300px; max-height: 380px; overflow-y: auto; padding: 8px 10px;
  }
  #work-filter-actions {
    display: flex; gap: 8px; margin-bottom: 8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  #work-filter-actions button {
    font-size: 11px; background: #fff; border: 1px solid var(--maroon); color: var(--maroon);
    border-radius: 3px; padding: 3px 8px; cursor: pointer; font-family: Georgia, serif;
  }
  #work-filter-actions button:hover { background: #fbeaea; }
  .wf-genre { margin-bottom: 4px; }
  .wf-author { margin: 1px 0 4px 16px; }
  .wf-work { margin: 1px 0 1px 16px; }
  .wf-row {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    padding: 2px 2px; cursor: pointer; border-radius: 2px;
  }
  .wf-row:hover { background: #fbf7ef; }
  .wf-genre > .wf-row { font-weight: bold; }
  .wf-author > .wf-row { font-weight: bold; color: #444; }
  .wf-row input[type=checkbox] { cursor: pointer; margin: 0; }
  .wf-count { color: #999; font-size: 10px; margin-left: auto; padding-left: 6px; }

</style>
</head>
<body>

<header>
  <h1>Treebank Search</h1>
  <span style="font-size:12px;opacity:.85">Bilingual word &amp; morphology search across annotated editions</span>
  <a href="../index.html" style="margin-left:auto">&larr; Back to reader</a>
</header>
<div id="status-bar">Initializing…</div>

<div id="controls">
  <div class="field">
    <label for="q" id="q-label">Word (Greek / Latin / Arabic / Persian)</label>
    <input type="text" id="q" placeholder="e.g. λύω or λυω (accents optional)">
  </div>
  <div class="field">
    <label for="mode">Match against</label>
    <select id="mode">
      <option value="either" selected>Lemma or form</option>
      <option value="lemma">Lemma only</option>
      <option value="form">Form only (exact inflection)</option>
      <option value="gloss">English gloss (word-level)</option>
      <option value="translation">English literal/translation (sentence-level)</option>
    </select>
  </div>
  <div class="field" id="work-filter-field">
    <label for="work-filter-summary">Works</label>
    <details id="work-filter-details">
      <summary id="work-filter-summary">All works</summary>
      <div id="work-filter-panel">
        <div id="work-filter-actions">
          <button type="button" id="work-filter-all">Select all</button>
          <button type="button" id="work-filter-none">Clear all</button>
        </div>
        <div id="work-filter-tree"><!-- populated once shards load, see buildWorkFilterTree() --></div>
      </div>
    </details>
  </div>
  <div class="field" id="whole-word-field" style="display:none">
    <label for="whole-word">&nbsp;</label>
    <label style="display:flex;align-items:center;gap:5px;font-weight:normal;font-size:13px;color:#333;height:34px">
      <input type="checkbox" id="whole-word" checked> Whole word only
    </label>
  </div>
  <div class="field">
    <label for="greek-translit-mode">Greek display</label>
    <select id="greek-translit-mode" onchange="onGreekTranslitModeChange()">
      <option value="">Original (polytonic)</option>
      <option value="simple">Transliteration — simple</option>
      <option value="full">Transliteration — scholarly</option>
    </select>
  </div>
  <button id="search-btn">Search</button>
  <span id="advanced-toggle" onclick="toggleAdvanced()">Morphology filters ▾</span>

  <div id="advanced-panel"></div>
</div>

<main>
  <div id="dashboard"></div>
  <div id="results-toolbar" style="display:none">
    <span id="results-count"></span>
    <button id="csv-btn" onclick="downloadCsv()">Download all matches (CSV)</button>
  </div>
  <div id="results"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────
// CONFIG — adjust these three paths to match wherever this file is deployed
// relative to the existing persverscomp `site/` output. Defaults assume this
// file lives at  <repo-root>/search/index.html,  a sibling of the main
// reader's  <repo-root>/index.html  and the existing  <repo-root>/site/  dir.
// ─────────────────────────────────────────────────────────────────────────
const CONFIG = {
  CATALOG_URL: "../site/catalog.json",
  DATA_DIR:    "../site/data",
  READER_URL:  "../index.html",
  // Cap on how many KWIC rows are rendered to the page at once. Aggregate
  // counts/dashboards always reflect the FULL match set regardless of this.
  RENDER_CAP: 200,
  // ── Work title overrides ────────────────────────────────────────────
  // catalog.json's per-work "label" comes from `SELECT MIN(label) FROM
  // text_units WHERE textgroup=? AND work=?` in the build notebook's
  // sharding cell — text_units holds a row for EVERY edition/translation/
  // commentary/treebank registered under that work, so MIN() just picks
  // whichever of THOSE labels sorts first alphabetically (e.g. "Arabic
  // (Abū Bishr Mattā, c. 900)" for Aristotle's Poetics, or "English (A.T.
  // Murray, 1924)" for Homer's Iliad) — not a real work title.
  //
  // Fill in one line per work key below to fix its display name here and
  // now, with no need to touch or re-run the build notebook. The exact
  // work keys in your current catalog are printed in the status bar once
  // shards finish loading (e.g. "tlg0012.tlg001, tlg0012.tlg002, ..."), or
  // just open the browser console and inspect `SHARDS.keys()`. Any work
  // key left out falls back to catalog.json's label, so this degrades
  // gracefully as you add works before getting around to titling them.
  WORK_TITLES: {
    // Sourced directly from app.js's AUTHOR_NAMES + WORK_TITLES/WORK_NAMES
    // tables (the reader's own grouped work-picker data), not guessed.
        "tlg0003.tlg001": "Thucydides, History",
        "tlg0011.tlg002": "Sophocles, Antigone",
        "tlg0011.tlg003": "Sophocles, Ajax",
        "tlg0011.tlg004": "Sophocles, Oedipus Rex",
        "tlg0011.tlg005": "Sophocles, Electra",
        "tlg0011.tlg006": "Sophocles, Philoctetes",
        "tlg0011.tlg007": "Sophocles, Oedipus at Colonus",

    "tlg0012.tlg001": "Homer, Iliad",
    "tlg0012.tlg002": "Homer, Odyssey",
    "tlg0020.tlg001": "Hesiod, Theogony",
    "tlg0020.tlg002": "Hesiod, Works and Days",
    "tlg0020.tlg003": "Hesiod, Shield of Heracles",
    "tlg0085.tlg001": "Aeschylus, Suppliant Women",
    "tlg0085.tlg002": "Aeschylus, Persians",
    "tlg0085.tlg003": "Aeschylus, Prometheus Bound",
    "tlg0085.tlg004": "Aeschylus, Seven Against Thebes",
    "tlg0085.tlg005": "Aeschylus, Agamemnon",
    "tlg0085.tlg006": "Aeschylus, Libation Bearers",
    "tlg0085.tlg007": "Aeschylus, Eumenides",

    "tlg0086.tlg034": "Aristotle, Poetics",
    // Not in app.js's tables (added since, or handled outside the grouped
    // picker) — standard English title, adjust if you'd prefer otherwise.
    "ferdowsi.shahnameh": "Ferdowsi, Shahnameh",
  },
  // ── Work-filter tree grouping ───────────────────────────────────────
  // AUTHOR is the middle tier of the work-filter checkbox tree (e.g. "all
  // Aeschylus"), keyed by textgroup (the part of a work key before the
  // dot — "tlg0085.tlg001" -> "tlg0085"). A textgroup left out here falls
  // back to the first comma-delimited segment of its first loaded work's
  // title (from WORK_TITLES/catalog.json), and failing that, the bare
  // textgroup id -- so, like WORK_TITLES, this degrades gracefully as new
  // works are added before you get around to labeling them.
  WORK_AUTHORS: {
    "tlg0003": "Thucydides",
    "tlg0011": "Sophocles",
    "tlg0012": "Homer",
    "tlg0020": "Hesiod",
    "tlg0085": "Aeschylus",
    "tlg0086": "Aristotle",
    "ferdowsi": "Ferdowsi",
  },
  // GENRE_GROUPS is the top tier (e.g. "Epic" spanning Homer + Hesiod) --
  // a genre label mapped to the list of textgroups it spans. A textgroup
  // not listed under any genre here just shows at the Author tier with no
  // Genre parent above it (this is why Aeschylus/Sophocles currently show
  // as plain top-level Author groups rather than nested under a "Tragedy"
  // genre -- add one below if you'd like that same treatment).
  GENRE_GROUPS: {
    "Epic": ["tlg0012", "tlg0020"],
  },
};

// ── Greek transliteration engine (client-side, no precomputation; ported
// verbatim from the main reader's app.js so the two stay in sync). Converts
// polytonic Greek Unicode text into Latin transliteration on the fly. Two
// modes:
//   'simple' — plain ASCII-ish reading form, no accents/breathing marks
//              shown as diacritics, macrons dropped (e ~ eta, o ~ omega).
//   'full'   — scholarly form: acute/grave/circumflex accents rendered as
//              combining diacritics on the corresponding Latin vowel,
//              long eta/omega marked with a macron (ē/ō), iota subscript
//              shown as an appended -i, rough breathing as h-/rh-.
// Works directly on HTML strings/DOM text nodes: it only rewrites contiguous
// runs of Greek-range codepoints, so tags/attributes/entities, and any
// Persian/Arabic text elsewhere on the page, pass through untouched.
const GK_SMOOTH      = '\u0313';
const GK_ROUGH        = '\u0314';
const GK_ACUTE        = '\u0301';
const GK_GRAVE        = '\u0300';
const GK_CIRCUMFLEX_A = '\u0342'; // perispomeni
const GK_CIRCUMFLEX_B = '\u0303'; // combining tilde (occasional alt encoding)
const GK_IOTA_SUB     = '\u0345'; // ypogegrammeni
const GK_DIAERESIS    = '\u0308';
const GK_MACRON       = '\u0304';
const GK_BREVE        = '\u0306';
const GK_COMBINING_MARKS = new Set([
  GK_SMOOTH, GK_ROUGH, GK_ACUTE, GK_GRAVE, GK_CIRCUMFLEX_A, GK_CIRCUMFLEX_B,
  GK_IOTA_SUB, GK_DIAERESIS, GK_MACRON, GK_BREVE
]);

const GREEK_BASE_LETTERS = {
  'α': { s: 'a',  f: 'a'  }, 'β': { s: 'b',  f: 'b'  }, 'γ': { s: 'g',  f: 'g'  },
  'δ': { s: 'd',  f: 'd'  }, 'ε': { s: 'e',  f: 'e'  }, 'ζ': { s: 'z',  f: 'z'  },
  'η': { s: 'e',  f: 'ē'  }, 'θ': { s: 'th', f: 'th' }, 'ι': { s: 'i',  f: 'i'  },
  'κ': { s: 'k',  f: 'k'  }, 'λ': { s: 'l',  f: 'l'  }, 'μ': { s: 'm',  f: 'm'  },
  'ν': { s: 'n',  f: 'n'  }, 'ξ': { s: 'x',  f: 'x'  }, 'ο': { s: 'o',  f: 'o'  },
  'π': { s: 'p',  f: 'p'  }, 'ρ': { s: 'r',  f: 'r'  }, 'σ': { s: 's',  f: 's'  },
  'ς': { s: 's',  f: 's'  }, 'τ': { s: 't',  f: 't'  }, 'υ': { s: 'u',  f: 'u'  },
  'φ': { s: 'ph', f: 'ph' }, 'χ': { s: 'kh', f: 'kh' }, 'ψ': { s: 'ps', f: 'ps' },
  'ω': { s: 'o',  f: 'ō'  },
};
const GREEK_DIPHTHONGS = {
  'αι': { s: 'ai', f: 'ai' }, 'ει': { s: 'ei', f: 'ei' }, 'οι': { s: 'oi', f: 'oi' },
  'υι': { s: 'ui', f: 'ui' }, 'αυ': { s: 'au', f: 'au' }, 'ευ': { s: 'eu', f: 'eu' },
  'ηυ': { s: 'eu', f: 'ēu' }, 'ου': { s: 'ou', f: 'ou' },
};
const GREEK_PUNCT_MAP = {
  '\u037E': '?',   // Greek question mark
  '\u0387': ';',   // ano teleia
  '\u1FBD': "'",   // koronis (elision)
  '\u1FBF': "'",   // psili used standalone
  '\u1FFE': "'",   // dasia used standalone
};
const GK_LATIN_VOWELS = 'aeiouyēō';

function _gkGroupLetters(nfdStr) {
  const letters = [];
  for (const ch of nfdStr) {
    if (GK_COMBINING_MARKS.has(ch) && letters.length) {
      letters[letters.length - 1].marks.push(ch);
    } else {
      letters.push({ base: ch, marks: [] });
    }
  }
  return letters;
}

function _gkMergeDiphthongs(letters) {
  const out = [];
  for (let i = 0; i < letters.length; i++) {
    const cur = letters[i];
    const nxt = letters[i + 1];
    if (nxt) {
      const curLower = cur.base.toLowerCase();
      const nxtLower = nxt.base.toLowerCase();
      const pairKey = curLower + nxtLower;
      const hasDiaeresis = nxt.marks.includes(GK_DIAERESIS);
      const curHasIotaSub = cur.marks.includes(GK_IOTA_SUB);
      if (GREEK_DIPHTHONGS[pairKey] && !hasDiaeresis && !curHasIotaSub) {
        out.push({
          diphthong: pairKey,
          marks: cur.marks.concat(nxt.marks),
          isUpper: cur.base !== curLower,
        });
        i++; // consumed the second vowel
        continue;
      }
    }
    out.push({ base: cur.base, marks: cur.marks, isUpper: cur.base !== cur.base.toLowerCase() });
  }
  return out;
}

function _gkInsertAccent(str, accentMark) {
  // Greek writes the accent over a diphthong's second vowel (e.g. αἵ ->
  // haî, not hâi), so scan from the end and mark the last Latin vowel.
  for (let i = str.length - 1; i >= 0; i--) {
    if (GK_LATIN_VOWELS.includes(str[i])) {
      return str.slice(0, i + 1) + accentMark + str.slice(i + 1);
    }
  }
  return str + accentMark;
}

function _gkRenderUnit(unit, mode, nextBaseLower) {
  let latin;
  if (unit.diphthong) {
    const d = GREEK_DIPHTHONGS[unit.diphthong];
    latin = (mode === 'full') ? d.f : d.s;
  } else {
    const lower = unit.base.toLowerCase();
    const entry = GREEK_BASE_LETTERS[lower];
    if (!entry) {
      // Not a recognized Greek letter (punctuation, space, markup char).
      return (GREEK_PUNCT_MAP[unit.base] !== undefined) ? GREEK_PUNCT_MAP[unit.base] : unit.base;
    }
    latin = (mode === 'full') ? entry.f : entry.s;
    if (lower === 'γ' && nextBaseLower && 'γκξχ'.includes(nextBaseLower)) {
      latin = 'n'; // gamma nasal (ἄγγελος -> angelos)
    }
    if (lower === 'ρ') {
      latin = unit.marks.includes(GK_ROUGH) ? 'rh' : 'r';
    }
  }
  const isRho = !unit.diphthong && unit.base.toLowerCase() === 'ρ';
  if (!isRho && unit.marks.includes(GK_ROUGH)) {
    latin = 'h' + latin;
  }
  if (mode === 'full') {
    if (unit.marks.includes(GK_ACUTE)) latin = _gkInsertAccent(latin, GK_ACUTE);
    else if (unit.marks.includes(GK_GRAVE)) latin = _gkInsertAccent(latin, GK_GRAVE);
    else if (unit.marks.includes(GK_CIRCUMFLEX_A) || unit.marks.includes(GK_CIRCUMFLEX_B)) latin = _gkInsertAccent(latin, '\u0302');
    if (unit.marks.includes(GK_IOTA_SUB)) latin += 'i';
  }
  if (unit.isUpper) latin = latin.charAt(0).toUpperCase() + latin.slice(1);
  return latin;
}

function transliterateGreekWord(word, mode) {
  const nfd = word.normalize('NFD');
  const letters = _gkGroupLetters(nfd);
  const units = _gkMergeDiphthongs(letters);
  let result = '';
  for (let i = 0; i < units.length; i++) {
    const nxt = units[i + 1];
    const nextBaseLower = nxt ? (nxt.diphthong ? nxt.diphthong[0] : nxt.base.toLowerCase()) : null;
    result += _gkRenderUnit(units[i], mode, nextBaseLower);
  }
  return result.normalize('NFC');
}

// Matches contiguous runs of Greek/Coptic + Greek Extended codepoints
// (letters, breathing/accent marks, and Greek-specific punctuation).
// Anything outside these ranges — HTML tags, attributes, English text,
// Persian/Arabic script — is left completely untouched.
const GREEK_RUN_REGEX = /[\u0370-\u03FF\u1F00-\u1FFF]+/gu;
// Non-global sibling used purely for "does this contain any Greek at all"
// checks (a global regex's .test() mutates lastIndex between calls, which
// would silently break repeated presence checks across renders).
const GREEK_HAS_REGEX = /[\u0370-\u03FF\u1F00-\u1FFF]/u;

function transliterateHtmlFragment(html, mode) {
  if (!mode) return html;
  return html.replace(GREEK_RUN_REGEX, (run) => transliterateGreekWord(run, mode));
}

// Walks a live DOM subtree and transliterates (or restores) its text nodes
// in place, without touching element structure or attributes — safe here
// since every click handler in this app is an inline onclick="" (baked into
// the HTML string itself), not addEventListener, so there's nothing a text-
// node rewrite could silently strip.
function walkAndTransliterateNode(rootEl, mode) {
  if (!rootEl) return;
  const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
  let node;
  while ((node = walker.nextNode())) {
    if (node.__gkOriginal === undefined) node.__gkOriginal = node.nodeValue;
    node.nodeValue = mode ? transliterateHtmlFragment(node.__gkOriginal, mode) : node.__gkOriginal;
  }
}

// Global (page-wide, not per-column — this app has one Greek-facing view,
// not the reader's multi-column layout) transliteration mode, applied to
// every freshly-rendered chunk of the dashboard/results area.
let GREEK_TRANSLIT_MODE = "";
window.onGreekTranslitModeChange = function () {
  const sel = document.getElementById("greek-translit-mode");
  GREEK_TRANSLIT_MODE = sel ? sel.value : "";
  applyGreekTranslitEverywhere();
};
function applyGreekTranslitEverywhere() {
  walkAndTransliterateNode(document.getElementById("dashboard"), GREEK_TRANSLIT_MODE);
  walkAndTransliterateNode(document.getElementById("results"), GREEK_TRANSLIT_MODE);
}

// ── Morphological feature picklist (UD-style keys/values as used in the
// Perseus/AGDT + Daphne CoNLL-U treebanks). "any" = no filter on that key. ──
